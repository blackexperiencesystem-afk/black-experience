<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiência a Bordo • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{
    padding:56px 22px 90px;
    text-align:center;
}

h1{
    font-size:26px;
    margin-bottom:10px;
}

.subtitle{
    color:#bfa74a;
    font-size:15px;
    opacity:.9;
    margin-bottom:36px;
}

.section-title{
    margin-top:28px;
    margin-bottom:6px;
    font-size:14px;
    letter-spacing:.6px;
    color:#888;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.btn{
    padding:18px;
    border-radius:18px;
    border:1px solid #2a2a2a;
    background:#0b0b0b;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    border-color:#444;
}

.btn.selected{
    border-color:#d4af37;
    background:#1a1405;
}

.confirm{
    margin-top:36px;
    width:100%;
    padding:20px;
    border:none;
    border-radius:40px;
    font-size:18px;
    font-weight:600;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    cursor:pointer;
    transition:.25s;
}

.confirm:hover{
    transform:scale(1.02);
}

/* LOADING PREMIUM */
#loading{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    font-size:16px;
    letter-spacing:.4px;
    opacity:.92;
}
</style>
</head>

<body>

<div class="container">

<h1>Prepare sua Experiência a Bordo</h1>

<div class="subtitle">
Escolha os detalhes que vão acompanhar seu momento VIP.
</div>

<!-- BEBIDAS -->
<div class="section-title">BEBIDAS</div>

<div class="menu">
<div class="btn" onclick="selectSingle(this,'bebida','Água sem gás')">💧 Água sem gás</div>
<div class="btn" onclick="selectSingle(this,'bebida','Água com gás')">🥤 Água com gás</div>
<div class="btn" onclick="selectSingle(this,'bebida','Mini Coca-Cola')">🥤 Mini Coca-Cola</div>
</div>

<!-- SNACKS -->
<div class="section-title">SNACKS</div>

<div class="menu">
<div class="btn" onclick="selectSingle(this,'snack','Ruffles')">🍟 Ruffles</div>
<div class="btn" onclick="selectSingle(this,'snack','KitKat')">🍫 KitKat</div>
<div class="btn" onclick="selectSingle(this,'snack','Amendoim')">🥜 Amendoim</div>
</div>

<button class="confirm" onclick="enviarPedido()">
Confirmar minha Experiência VIP
</button>

</div>

<!-- LOADING -->
<div id="loading">Preparando sua experiência…</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycby_zbIn5uEdlBhk-1F9SGQ5jiDbWb3Zks8Yzn859i-SIwjpM-NBBk6dSGFzgiOgGDfM7A/exec";

let bebida = "";
let snack = "";

/* seleção única */
function selectSingle(btn,tipo,valor){

    const grupo = btn.parentElement.querySelectorAll(".btn");
    grupo.forEach(b=>b.classList.remove("selected"));

    btn.classList.add("selected");

    if(tipo==="bebida") bebida = valor;
    if(tipo==="snack") snack = valor;
}

/* envio rápido + transição VIP */
function enviarPedido(){

    if(!bebida || !snack){
        alert("Selecione uma bebida e um snack.");
        return;
    }

    document.getElementById("loading").style.display = "flex";

    fetch(scriptURL,{
        method:"POST",
        body:new URLSearchParams({ bebida, snack })
    });

    setTimeout(()=>{
        window.location.href = "vip.html";
    }, 300);
}
</script>

</body>
</html>
