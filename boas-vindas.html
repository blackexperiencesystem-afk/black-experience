<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boas-vindas • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{
    padding:48px 22px 80px;
    text-align:center;
}

.menu{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.btn{
    padding:18px;
    border-radius:18px;
    border:1px solid #2a2a2a;
    background:#0b0b0b;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.btn.selected{
    border-color:#d4af37;
    background:#1a1405;
}

.confirm{
    margin-top:26px;
    width:100%;
    padding:20px;
    border:none;
    border-radius:40px;
    font-size:18px;
    font-weight:600;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    cursor:pointer;
}

/* LOADING PREMIUM */
#loading{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    font-size:16px;
    letter-spacing:.4px;
    opacity:.92;
}
</style>
</head>

<body>

<div class="container">

<h1>Boas-vindas</h1>

<div class="subtitle">
Escolha sua bebida e snack para começar sua experiência.
</div>

<!-- BEBIDAS -->
<div class="menu">
<strong>Bebidas</strong>

<div class="btn" onclick="selectSingle(this,'bebida','Água sem gás')">💧 Água sem gás</div>
<div class="btn" onclick="selectSingle(this,'bebida','Água com gás')">🥤 Água com gás</div>
<div class="btn" onclick="selectSingle(this,'bebida','Mini Coca-Cola')">🥤 Mini Coca-Cola</div>
</div>

<!-- SNACKS -->
<div class="menu">
<strong>Snacks</strong>

<div class="btn" onclick="selectSingle(this,'snack','Ruffles')">🍟 Ruffles</div>
<div class="btn" onclick="selectSingle(this,'snack','KitKat')">🍫 KitKat</div>
<div class="btn" onclick="selectSingle(this,'snack','Amendoim')">🥜 Amendoim</div>
</div>

<button class="confirm" onclick="enviarPedido()">
Entrar na Área VIP
</button>

</div>

<!-- LOADING -->
<div id="loading">Carregando experiência…</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwCkdVZG_GiyctWa7I-gR2raCc2Z59G-9DwyiUlZUM6FZbPKLhn6HV1FSut0deCpVdp4A/exec";

let bebida = "";
let snack = "";

/* seleção única */
function selectSingle(btn,tipo,valor){

    const grupo = btn.parentElement.querySelectorAll(".btn");
    grupo.forEach(b=>b.classList.remove("selected"));

    btn.classList.add("selected");

    if(tipo==="bebida") bebida = valor;
    if(tipo==="snack") snack = valor;
}

/* envio rápido + transição VIP */
function enviarPedido(){

    if(!bebida || !snack){
        alert("Selecione uma bebida e um snack.");
        return;
    }

    /* mostra loading imediato */
    document.getElementById("loading").style.display = "flex";

    /* envia em segundo plano */
    fetch(scriptURL,{
        method:"POST",
        body:new URLSearchParams({ bebida, snack })
    });

    /* entra rápido na VIP */
    setTimeout(()=>{
        window.location.href = "vip.html";
    }, 300);
}
</script>

</body>
</html>
