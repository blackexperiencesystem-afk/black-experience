<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiência a Bordo • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{
    padding:64px 24px 100px;
    text-align:center;
    max-width:420px;
    margin:auto;
}

h1{
    font-size:24px;
    font-weight:500;
    margin-bottom:8px;
}

.subtitle{
    color:#9a9a9a;
    font-size:14px;
    margin-bottom:44px;
}

.section-title{
    margin:32px 0 10px;
    font-size:12px;
    letter-spacing:1.2px;
    color:#6f6f6f;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* BOTÕES BLACK MINIMAL */
.btn{
    padding:18px 20px;
    border-radius:16px;
    border:1px solid #262626;
    background:#0a0a0a;
    color:#f2f2f2;
    font-size:15px;
    cursor:pointer;
    transition:.18s ease;
}

.btn:hover{
    border-color:#3a3a3a;
    background:#0f0f0f;
}

.btn.selected{
    border-color:#c6a94a;
    background:#15120a;
    color:#fff;
}

/* BOTÃO FINAL */
.confirm{
    margin-top:44px;
    width:100%;
    padding:18px;
    border:none;
    border-radius:36px;
    font-size:16px;
    font-weight:600;
    background:linear-gradient(135deg,#c6a94a,#e7cc7a);
    color:#000;
    cursor:pointer;
    transition:.22s ease;
}

.confirm:hover{
    transform:translateY(-1px);
}

/* LOADING PREMIUM */
#loading{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    font-size:15px;
    letter-spacing:.4px;
    opacity:.94;
}
</style>
</head>

<body>

<div class="container">

<h1>Prepare sua Experiência a Bordo</h1>

<div class="subtitle">
Escolha os detalhes que vão acompanhar seu momento VIP.
</div>

<!-- BEBIDAS -->
<div class="section-title">BEBIDAS</div>

<div class="menu">
<div class="btn" onclick="selectSingle(this,'bebida','Água sem gás')">Água sem gás</div>
<div class="btn" onclick="selectSingle(this,'bebida','Água com gás')">Água com gás</div>
<div class="btn" onclick="selectSingle(this,'bebida','Mini Coca-Cola')">Mini Coca-Cola</div>
</div>

<!-- SNACKS -->
<div class="section-title">SNACKS</div>

<div class="menu">
<div class="btn" onclick="selectSingle(this,'snack','Ruffles')">Ruffles</div>
<div class="btn" onclick="selectSingle(this,'snack','KitKat')">KitKat</div>
<div class="btn" onclick="selectSingle(this,'snack','Amendoim')">Amendoim</div>
</div>

<button class="confirm" onclick="enviarPedido()">
Confirmar minha Experiência VIP
</button>

</div>

<!-- LOADING -->
<div id="loading">Preparando sua experiência…</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycby_zbIn5uEdlBhk-1F9SGQ5jiDbWb3Zks8Yzn859i-SIwjpM-NBBk6dSGFzgiOgGDfM7A/exec";

let bebida = "";
let snack = "";

/* seleção única */
function selectSingle(btn,tipo,valor){

    const grupo = btn.parentElement.querySelectorAll(".btn");
    grupo.forEach(b=>b.classList.remove("selected"));

    btn.classList.add("selected");

    if(tipo==="bebida") bebida = valor;
    if(tipo==="snack") snack = valor;
}

/* envio rápido + transição VIP */
function enviarPedido(){

    if(!bebida || !snack){
        alert("Selecione uma bebida e um snack.");
        return;
    }

    document.getElementById("loading").style.display = "flex";

    fetch(scriptURL,{
        method:"POST",
        body:new URLSearchParams({ bebida, snack })
    });

    setTimeout(()=>{
        window.location.href = "vip.html";
    }, 300);
}
</script>

</body>
</html>
