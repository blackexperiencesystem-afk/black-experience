<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Executivo • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
/* Ajustes específicos do modo executivo */

.container{
    padding:50px 24px;
}

/* Título mais sóbrio */
h1{
    font-size:44px;
    margin-bottom:10px;
}

/* Subtítulo discreto */
.subtitle{
    font-size:18px;
    color:#9c8b4b;
    margin-bottom:48px;
    max-width:520px;
}

/* Botões executivos */
.menu{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:26px;
}

/* Estilo mais sóbrio que o dourado forte */
.btn-exec{
    padding:26px;
    border-radius:22px;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    border:1px solid rgba(212,175,55,0.35);
    background:linear-gradient(135deg,#1a1a1a,#0d0d0d);
    color:#d4af37;
    transition:.18s ease;
    text-align:center;
}

.btn-exec:active{
    transform:scale(0.97);
}

.btn-exec span{
    display:block;
    font-size:14px;
    font-weight:normal;
    margin-top:6px;
    color:#8c7a32;
}
</style>
</head>

<body>

<div class="container">

  <h1>Modo Executivo</h1>

  <div class="subtitle">
    Ambiente silencioso e produtivo para trabalhar,
    planejar ou apenas focar durante a viagem.
  </div>

  <div class="menu">

    <!-- WHATSAPP -->
    <div class="btn-exec" onclick="abrirWhatsApp()">
      💬 WhatsApp
      <span>Responda mensagens com privacidade</span>
    </div>

    <!-- GOOGLE DOCS -->
    <div class="btn-exec" onclick="abrirDocs()">
      📝 Documentos
      <span>Acesse arquivos e anotações importantes</span>
    </div>

    <!-- NAVEGADOR -->
    <div class="btn-exec" onclick="abrirNavegador()">
      🌐 Navegação Web
      <span>Pesquise ou acompanhe informações em tempo real</span>
    </div>

  </div>

  <div class="back" onclick="goBack()">← voltar</div>

</div>

<script src="assets/ui.js"></script>

<script>
function abrirWhatsApp(){
    if(typeof fully !== "undefined"){
        fully.startApplication("com.whatsapp");
    }
}

function abrirDocs(){
    if(typeof fully !== "undefined"){
        fully.startApplication("com.google.android.apps.docs");
    }
}

function abrirNavegador(){
    if(typeof fully !== "undefined"){
        fully.startApplication("com.android.chrome");
    }
}
</script>

</body>
</html>
