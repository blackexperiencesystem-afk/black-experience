<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Executivo</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{ padding:48px 22px 80px; }

.section{ margin-bottom:28px; text-align:left; }

.section-title{
  font-size:14px;
  opacity:.6;
  margin-bottom:10px;
  letter-spacing:.5px;
}

.btn-exec{
  width:100%;
  padding:18px;
  margin:8px 0;
  border-radius:16px;
  border:1px solid #2a2a2a;
  background:#0b0b0b;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:all .25s ease;
}

/* ✨ BRILHO AO CLICAR */
.btn-exec.clicked{
  border-color:#d4af37;
  background:#1a1405;
  box-shadow:
    0 0 12px rgba(212,175,55,0.7),
    0 0 24px rgba(212,175,55,0.35);
  transform:scale(0.98);
}

/* AVISO */
.toast{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#111;
  border:1px solid rgba(212,175,55,.5);
  padding:14px 18px;
  border-radius:14px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:all .35s ease;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="container">

<h1>Modo Executivo</h1>
<div class="subtitle">Controle silencioso da sua viagem</div>

<!-- ENERGIA -->
<div class="section">
  <div class="section-title">Energia</div>
  <button class="btn-exec" onclick="acao(this,'🔋 Power Bank solicitado')">
    🔋 Solicitar Power Bank ultra-rápido
  </button>
</div>

<!-- RITMO -->
<div class="section">
  <div class="section-title">Ritmo da viagem</div>
  <button class="btn-exec" onclick="acao(this,'⚡ Passageiro com pressa')">
    ⚡ Estou com pressa
  </button>
  <button class="btn-exec" onclick="acao(this,'😌 Direção tranquila solicitada')">
    😌 Prefiro uma direção tranquila
  </button>
</div>

<!-- SOM -->
<div class="section">
  <div class="section-title">Ambiente sonoro</div>
  <button class="btn-exec" onclick="acao(this,'🤫 Modo silencioso ativado')">
    🤫 Modo silencioso
  </button>
  <button class="btn-exec" onclick="abrirSpotify(this)">
    🎵 Abrir Spotify
  </button>
</div>

<!-- CONFORTO -->
<div class="section">
  <div class="section-title">Conforto da cabine</div>
  <button class="btn-exec" onclick="window.location.href='conforto-player.html'">
    🌡️ Ajustar climatização e aroma
  </button>
</div>

<!-- NECESSIDADES -->
<div class="section">
  <div class="section-title">Durante a viagem</div>
  <button class="btn-exec" onclick="acao(this,'📍 Passageiro pediu parada rápida')">
    📍 Preciso de uma parada rápida
  </button>
</div>

<div class="back" onclick="goBack()">← voltar</div>

</div>

<!-- AVISO VISUAL -->
<div class="toast" id="toast">Solicitado ao motorista ✔</div>

<script src="assets/ui.js"></script>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycby_zbIn5uEdlBhk-1F9SGQ5jiDbWb3Zks8Yzn859i-SIwjpM-NBBk6dSGFzgiOgGDfM7A/exec";

/* FUNÇÃO PADRÃO DE AÇÃO */
function acao(botao, mensagem){

  /* brilho */
  botao.classList.add("clicked");
  setTimeout(()=>botao.classList.remove("clicked"), 600);

  /* envia ao telegram */
  fetch(scriptURL,{
    method:"POST",
    body:new URLSearchParams({ executivo: mensagem })
  });

  mostrarToast();
}

/* SPOTIFY */
function abrirSpotify(botao){
  acao(botao,'🎵 Passageiro abriu Spotify');

  if (typeof fully !== "undefined") {
    fully.startApplication("com.spotify.music");
  } else {
    window.open("https://open.spotify.com/", "_blank");
  }
}

/* TOAST VISUAL */
function mostrarToast(){
  const toast = document.getElementById("toast");
  toast.classList.add("show");

  setTimeout(()=>toast.classList.remove("show"), 2200);
}
</script>

</body>
</html>
