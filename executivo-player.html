<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Executivo</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{ padding:48px 22px 80px; }

.section{ margin-bottom:28px; text-align:left; }

.section-title{
  font-size:14px;
  opacity:.6;
  margin-bottom:10px;
  letter-spacing:.5px;
}

.btn-exec{
  width:100%;
  padding:18px;
  margin:8px 0;
  border-radius:16px;
  border:1px solid #2a2a2a;
  background:#0b0b0b;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.btn-exec:active{ transform:scale(.97); }

.ok{
  display:none;
  margin-top:18px;
  font-size:14px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="container">

<h1>Modo Executivo</h1>
<div class="subtitle">Controle silencioso da sua viagem</div>

<!-- ENERGIA -->
<div class="section">
  <div class="section-title">Energia</div>
  <button class="btn-exec" onclick="enviar('🔋 Power Bank solicitado')">
    🔋 Solicitar Power Bank ultra-rápido
  </button>
</div>

<!-- RITMO -->
<div class="section">
  <div class="section-title">Ritmo da viagem</div>
  <button class="btn-exec" onclick="enviar('⚡ Passageiro com pressa')">
    ⚡ Estou com pressa
  </button>
  <button class="btn-exec" onclick="enviar('😌 Direção tranquila solicitada')">
    😌 Prefiro uma direção tranquila
  </button>
</div>

<!-- SOM -->
<div class="section">
  <div class="section-title">Ambiente sonoro</div>
  <button class="btn-exec" onclick="enviar('🤫 Ativar modo silencioso')">
    🤫 Modo silencioso
  </button>
  <button class="btn-exec" onclick="abrirSpotify()">
    🎵 Ouvir Spotify
  </button>
</div>

<!-- CONFORTO -->
<div class="section">
  <div class="section-title">Conforto da cabine</div>
  <button class="btn-exec" onclick="window.location.href='conforto-player.html'">
    🌡️ Ajustar climatização e aroma
  </button>
</div>

<!-- NECESSIDADES -->
<div class="section">
  <div class="section-title">Durante a viagem</div>
  <button class="btn-exec" onclick="enviar('📍 Passageiro pediu parada rápida')">
    📍 Preciso de uma parada rápida
  </button>
</div>

<!-- ADMIN -->
<div class="section">
  <div class="section-title">Administrativo</div>
  <button class="btn-exec" onclick="enviar('🧾 Solicitação de recibo')">
    🧾 Solicitar recibo da viagem
  </button>
</div>

<div class="ok" id="ok">Solicitação enviada ao motorista ✔</div>

<div class="back" onclick="goBack()">← voltar</div>

</div>

<script src="assets/ui.js"></script>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbz3k2L4xBpscC2nWRIGmgcKT7cS6Wsv4rTZo8XHuKNpMCBaTFbmvrizn59lEJZwF1kWRw/exec";

function enviar(msg){
  fetch(scriptURL,{
    method:"POST",
    body:new URLSearchParams({ executivo: msg })
  });

  document.getElementById("ok").style.display="block";
}

function abrirSpotify(){
  if(typeof fully !== "undefined"){
    fully.startApplication("com.spotify.music");
  } else {
    enviar("🎵 Passageiro pediu Spotify");
  }
}
</script>

</body>
</html>
