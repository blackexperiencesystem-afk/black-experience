<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
/* Ajustes específicos da página Cinema */

/* Container principal */
.container {
    padding: 50px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Título maior e centralizado */
h1 {
    font-size: 46px;
    margin-bottom: 8px;
}

/* Subtítulo com mais impacto */
.subtitle {
    font-size: 20px;
    color: #bfa75a;
    margin-bottom: 40px;
    max-width: 600px;
    line-height: 1.4;
}

/* Menu com botões maiores */
.menu {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 32px;
    margin-bottom: 50px;
}

/* Botões de seleção principais */
.btn-cinema {
    padding: 30px;
    border-radius: 80px;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(212,175,55,0.45);
    background: radial-gradient(
        circle at top,
        #f1d27a 0%,
        #d4af37 40%,
        #b89b30 100%
    );
    color: #000;
    transition: transform .15s ease, box-shadow .15s ease;
    display: flex;
    justify-content: center;
    align-items: center;
}

.btn-cinema:active {
    transform: scale(0.97);
}

.btn-cinema span {
    display: block;
    font-size: 16px;
    font-weight: normal;
    margin-top: 8px;
    color: #3a2e00;
}

/* Voltar discreto padrão */
.back {
    margin-top: 60px;
    font-size: 14px;
    color: #777;
    cursor: pointer;
    transition: .2s;
}

.back:hover {
    color: #fff;
}
</style>

</head>

<body>

<div class="container">

  <h1>Cinema</h1>

  <div class="subtitle">
    Clássicos e lançamentos.<br>
    Assista no estilo Black Experience.
  </div>

  <div class="menu">

    <div class="btn-cinema" onclick="abrirTrailer()">
      🎬 Assistir Trailer
      <span>Veja os melhores trailers em alta definição</span>
    </div>

    <div class="btn-cinema" onclick="abrirFilmes()">
      🍿 Assistir Filmes
      <span>Títulos selecionados pra você</span>
    </div>

  </div>

  <div class="back" onclick="goBack()">← voltar</div>

</div>

<script src="assets/ui.js"></script>

<script>
function abrirTrailer(){
    if (typeof fully !== "undefined") {
        fully.startApplication("com.mxtech.videoplayer.pro");
    }
}

function abrirFilmes(){
    if (typeof fully !== "undefined") {
        fully.startApplication("com.mxtech.videoplayer.pro");
    }
}
</script>

</body>
</html>
