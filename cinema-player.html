<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
/* Ajustes específicos da página Cinema */

.container {
    padding: 50px 24px;
}

/* Título maior */
h1 {
    font-size: 46px;
    margin-bottom: 10px;
}

/* Subtítulo */
.subtitle {
    font-size: 20px;
    color: #bfa75a;
    margin-bottom: 50px;
    max-width: 600px;
}

/* Menu */
.menu {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 34px;
}

/* Botões grandes */
.btn-cinema {
    padding: 32px;
    border-radius: 80px;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(212,175,55,0.45);
    background: radial-gradient(circle at top,#f1d27a 0%,#d4af37 40%,#b89b30 100%);
    color: #000;
    transition: transform .15s ease, box-shadow .15s ease;
}

.btn-cinema:active {
    transform: scale(0.97);
}

.btn-cinema span {
    display: block;
    font-size: 16px;
    margin-top: 8px;
    color: #3a2e00;
}
</style>
</head>

<body>

<div class="container">

  <h1>Cinema</h1>

  <div class="subtitle">
    Clássicos e lançamentos.<br>
    Assista no estilo Black Experience.
  </div>

  <div class="menu">

    <!-- DISNEY+ -->
    <div class="btn-cinema" onclick="abrirDisney()">
      🏰 Disney+
      <span>Filmes, animações e universos inesquecíveis</span>
    </div>

    <!-- HBO MAX -->
    <div class="btn-cinema" onclick="abrirHBO()">
      🎥 HBO Max
      <span>Séries premiadas e grandes produções</span>
    </div>

  </div>

  <div class="back" onclick="goBack()">← voltar</div>

</div>

<script src="assets/ui.js"></script>

<script>
function abrirDisney(){
    if (typeof fully !== "undefined") {
        fully.startApplication("com.disney.disneyplus");
    }
}

function abrirHBO(){
    if (typeof fully !== "undefined") {
        fully.startApplication("com.hbo.hbonow");
    }
}
</script>

</body>
</html>
