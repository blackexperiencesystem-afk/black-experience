<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação recebida</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
}

.container{
max-width:420px;
padding:40px 24px;
}

h1{
font-size:32px;
margin-bottom:12px;
font-weight:600;
}

p{
opacity:.7;
line-height:1.5;
margin-bottom:32px;
}

.loader{
width:48px;
height:48px;
border:2px solid rgba(255,255,255,.15);
border-top:2px solid #d4af37;
border-radius:50%;
animation:spin 1s linear infinite;
margin:0 auto 28px;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

.btn{
display:inline-block;
margin-top:12px;
padding:14px 22px;
border-radius:999px;
background:linear-gradient(135deg,#d4af37,#f1d27a);
color:#000;
font-weight:600;
text-decoration:none;
}

.small{
margin-top:28px;
font-size:13px;
opacity:.4;
}
</style>
</head>

<body>

<div class="container">

<div class="loader"></div>

<h1>Pedido recebido</h1>

<p>
Sua sessão fotográfica será iniciada em instantes.<br>
Prepare-se para registrar este momento com elegância.
</p>

<a href="vip.html" class="btn">Voltar ao ambiente premium</a>

<div class="small">
Black Experience
</div>

</div>

</body>
</html>
