<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Executivo</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.container{
    max-width:520px;
    padding:40px 24px;
}

h1{
    font-size:38px;
    margin-bottom:12px;
}

p{
    opacity:.6;
    margin-bottom:40px;
    font-size:15px;
    line-height:1.4;
}

/* OPÇÕES */
.option{
    border:1px solid #222;
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
    background:#0e0e0e;
    font-size:16px;
}

/* CTA */
.cta{
    display:block;
    margin-top:28px;
    padding:20px;
    border-radius:40px;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    text-decoration:none;
    font-weight:600;
    font-size:16px;
}

/* VOLTAR */
.voltar{
    display:inline-block;
    margin-top:20px;
    font-size:13px;
    opacity:.4;
    color:#fff;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <h1>Modo Executivo</h1>

    <p>
        Um ambiente pensado para foco, discrição e produtividade durante sua viagem.
    </p>

    <div class="option">⚡ Power Bank ultra rápido</div>
    <div class="option">🔇 Ambiente silencioso</div>
    <div class="option">🎧 Música para concentração</div>
    <div class="option">📞 Conforto para chamadas e reuniões</div>

    <!-- AGORA LEVA PARA O PASSE PREMIUM -->
    <a href="vip.html" class="cta">
        Ativar Passe Premium
    </a>

    <a href="index.html" class="voltar">
        Voltar ao menu
    </a>

</div>

</body>
</html>
