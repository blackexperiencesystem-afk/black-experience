<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Música Premium</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.container{
    max-width:520px;
    width:90%;
}

h1{
    font-size:38px;
    margin-bottom:12px;
}

p{
    opacity:.7;
    line-height:1.5;
    margin-bottom:40px;
}

.botao{
    display:block;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    text-decoration:none;
    font-weight:bold;
    padding:18px;
    border-radius:40px;
    margin-bottom:18px;
}

.voltar{
    font-size:14px;
    opacity:.5;
    text-decoration:none;
    color:#fff;
}
</style>
</head>

<body>

<div class="container">

<h1>🎧 Música Premium</h1>

<p>
Abra o Spotify e escolha a trilha sonora perfeita  
para sua viagem.
</p>

<a class="botao" onclick="abrirSpotify()">
Entrar no Spotify
</a>

<a href="vip.html" class="voltar">Voltar</a>

</div>

<script>
function abrirSpotify(){
    if (typeof fully !== "undefined") {
        fully.startApplication("com.spotify.music");
    } else {
        window.location.href = "https://open.spotify.com/";
    }
}
</script>

</body>
</html>
