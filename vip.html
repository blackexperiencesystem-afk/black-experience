<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passe Premium</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{
    padding:48px 22px 80px;
    text-align:center;
}

/* BOTÕES GRANDES (estilo modo executivo) */
.big-btn{
    display:block;
    width:100%;
    margin:16px 0;
    padding:22px;
    border-radius:28px;
    text-decoration:none;
    font-size:20px;
    font-weight:600;
    color:#000;

    background:linear-gradient(
        135deg,
        #d4af37 0%,
        #f1d27a 50%,
        #d4af37 100%
    );

    box-shadow:
        0 10px 30px rgba(212,175,55,0.35),
        inset 0 1px 0 rgba(255,255,255,0.35);

    transition:transform .15s ease, box-shadow .15s ease;
}

.big-btn:active{
    transform:scale(0.97);
}

/* BOTÃO FOTOGRAFIA (outline dourado) */
.photo-btn{
    display:block;
    width:100%;
    margin-top:26px;
    padding:20px;
    border-radius:28px;
    text-decoration:none;
    font-size:18px;
    font-weight:600;

    color:#d4af37;
    border:1px solid rgba(212,175,55,0.6);
    background:transparent;

    transition:all .2s ease;
}

.photo-btn:active{
    transform:scale(0.97);
    background:rgba(212,175,55,0.08);
}

/* ENCERRAR */
.close{
    display:inline-block;
    margin-top:34px;
    font-size:13px;
    opacity:.4;
    text-decoration:none;
    color:#fff;
}
</style>
</head>

<body>

<div class="container">

<h1>Passe Premium</h1>

<div class="subtitle">
Experiência exclusiva liberada nesta viagem
</div>

<!-- BOTÕES PRINCIPAIS -->
<a class="big-btn" href="cinema-player.html">
🎬 Cinema
</a>

<a class="big-btn" href="jogos-player.html">
🎮 Jogos
</a>

<a class="big-btn" href="executivo-player.html">
💼 Modo Executivo
</a>

<!-- FOTOGRAFIA POR ÚLTIMO -->
<a class="photo-btn" href="fotografia.html">
📸 Fotografia Executiva no carro
</a>

<!-- ENCERRAR -->
<a class="close" href="index.html">
Encerrar modo premium
</a>

</div>

</body>
</html>
