<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passe Premium</title>

<link rel="stylesheet" href="assets/style.css">

<style>
/* CENTRALIZAÇÃO REAL DA TELA */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    color:#fff;
}

/* WRAPPER MAIS EQUILIBRADO */
.wrapper{
    width:100%;
    max-width:420px;          /* mais estreito = sensação premium */
    padding:48px 20px 40px;
    text-align:center;
}

/* TÍTULO */
h1{
    font-size:40px;
    margin-bottom:8px;
}

/* SUBTÍTULO */
.sub{
    opacity:.6;
    margin-bottom:36px;
    font-size:15px;
}

/* GRID MAIS COMPACTO */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:24px;
}

/* BOTÕES DO GRID */
.button{
    padding:22px 16px;
    border-radius:18px;
    text-decoration:none;
    color:#000;
    font-size:16px;
    font-weight:600;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    box-shadow:0 6px 18px rgba(212,175,55,0.25);
    transition:.18s ease;
}

.button:active{
    transform:scale(0.96);
}

/* BOTÃO EXECUTIVO PRINCIPAL */
.executivo{
    display:block;
    margin:4px auto 14px;
    padding:22px;
    width:100%;
    border-radius:18px;
    font-size:17px;
    font-weight:600;
    color:#000;
    background:linear-gradient(135deg,#d4af37,#f1d27a,#d4af37);
    box-shadow:0 8px 22px rgba(212,175,55,0.25);
}

.executivo:active{
    transform:scale(0.97);
}

/* BOTÃO FOTOGRAFIA */
.secondary{
    display:block;
    margin:0 auto 22px;
    padding:18px;
    border-radius:18px;
    text-decoration:none;
    color:#d4af37;
    border:1px solid rgba(212,175,55,0.5);
}

/* ENCERRAR */
.close{
    display:inline-block;
    font-size:13px;
    opacity:.4;
    text-decoration:none;
    color:#fff;
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Passe Premium</h1>
<div class="sub">Experiência exclusiva liberada nesta viagem</div>

<div class="grid">
    <a class="button" href="conforto-player.html">❄️ Conforto</a>
    <a class="button" href="musica-player.html">🎧 Música</a>
    <a class="button" href="cinema-player.html">🎬 Cinema</a>
    <a class="button" href="jogos-player.html">🎮 Jogos</a>
</div>

<div class="executivo" onclick="window.location.href='executivo-player.html'">
    💼 Modo Executivo
</div>

<a class="secondary" href="fotografia.html">
    📸 Fotografia Executiva no carro
</a>

<a class="close" href="index.html">
    Encerrar modo premium
</a>

</div>

</body>
</html>
