<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passe Premium</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

/* WRAPPER CENTRAL */
.wrapper{
    max-width:520px;
    margin:0 auto;
    padding:60px 20px 80px;
    text-align:center;
}

/* TÍTULO */
h1{
    font-size:42px;
    margin-bottom:8px;
}

/* SUBTÍTULO */
.sub{
    opacity:.55;
    margin-bottom:36px;
    font-size:15px;
}

/* GRID PRINCIPAL */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:30px;
}

/* BOTÕES DO GRID */
.button{
    padding:20px;
    border-radius:18px;
    text-decoration:none;
    color:#000;
    font-size:16px;
    font-weight:600;

    background:linear-gradient(135deg,#d4af37,#f1d27a);
    box-shadow:0 6px 18px rgba(212,175,55,0.25);

    transition:.2s;
}

.button:active{
    transform:scale(0.97);
}

/* BOTÃO EXECUTIVO (DESTAQUE DISCRETO) */
.executivo{
    display:block;
    margin:0 auto 12px;
    padding:18px;
    width:100%;
    border-radius:16px;
    text-decoration:none;

    background:linear-gradient(
        135deg,
        #d4af37 0%,
        #f1d27a 50%,
        #d4af37 100%
    );

    color:#000;
    font-size:16px;
    font-weight:600;

    box-shadow:0 6px 18px rgba(212,175,55,0.25);
}

.executivo:active{
    transform:scale(0.97);
}

/* BOTÃO FOTOGRAFIA */
.secondary{
    display:block;
    margin-top:10px;
    padding:16px;
    border-radius:16px;
    text-decoration:none;
    color:#d4af37;
    border:1px solid rgba(212,175,55,0.5);
}

/* ENCERRAR */
.close{
    display:inline-block;
    margin-top:22px;
    font-size:13px;
    opacity:.4;
    text-decoration:none;
    color:#fff;
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Passe Premium</h1>
<div class="sub">Experiência exclusiva liberada nesta viagem</div>

<div class="grid">
    <a class="button" href="conforto-player.html">❄️ Conforto</a>
    <a class="button" href="musica-player.html">🎧 Música</a>
    <a class="button" href="cinema-player.html">🎬 Cinema</a>
    <a class="button" href="jogos-player.html">🎮 Jogos</a>
</div>

<!-- MODO EXECUTIVO -->
<a class="executivo" href="executivo-player.html">
    💼 Modo Executivo
</a>

<!-- FOTOGRAFIA -->
<a class="secondary" href="fotografia.html">
    📸 Fotografia Executiva no carro
</a>

<a class="close" href="index.html">
    Encerrar modo premium
</a>

</div>

</body>
</html>
