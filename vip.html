<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passe Premium</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
    .secondary{
    background:transparent;
    color:#d4af37;
    border:1px solid rgba(212,175,55,0.5);
    box-shadow:none;
}

.secondary:active{
    transform:scale(0.97);
}


body{
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CONTAINER CENTRAL */
.container{
    text-align:center;
    max-width:520px;
    padding:48px 24px;
}

/* TÍTULO */
h1{
    font-size:44px;
    font-weight:600;
    margin-bottom:10px;
}

/* SUBTÍTULO */
.subtitle{
    opacity:.55;
    margin-bottom:42px;
    font-size:15px;
}

/* GRID DE BOTÕES */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:40px;
}

/* BOTÃO PREMIUM */
.button{
    padding:20px;
    border-radius:18px;
    text-decoration:none;
    color:#000;
    font-size:16px;
    font-weight:600;

    /* GRADIENTE PREMIUM DOURADO SUAVE */
    background:linear-gradient(135deg,#d4af37,#f1d27a);

    border:none;

    /* SOMBRA LEVE PARA DESTACAR DO FUNDO PRETO */
    box-shadow:0 6px 18px rgba(212,175,55,0.25);

    transition:all .2s ease;
}


    backdrop-filter:blur(6px);

    transition:all .25s ease;
}

/* HOVER PREMIUM DOURADO */
.button:hover{
    border-color:rgba(212,175,55,0.6);
    box-shadow:0 0 18px rgba(212,175,55,0.25);
    transform:translateY(-2px);
}

/* ENCERRAR */
.close{
    font-size:13px;
    opacity:.35;
    text-decoration:none;
    color:#fff;
    transition:.2s;
}

.close:hover{
    opacity:.7;
}
</style>
</head>

<body>

<div class="container">

<h1>Passe Premium</h1>
<p class="subtitle">Experiência exclusiva liberada nesta viagem</p>

<div class="grid">
    <a class="button" href="conforto-player.html">❄️ Conforto</a>
    <a class="button" href="musica-player.html">🎧 Música</a>
    <a class="button" href="cinema-player.html">🎬 Cinema</a>
    <a class="button" href="jogos-player.html">🎮 Jogos</a>
</div>
    <a class="button secondary" href="fotografia.html">📸 Fotografia Executiva</a>


<a class="close" href="index.html">Encerrar modo premium</a>

</div>

</body>
</html>
