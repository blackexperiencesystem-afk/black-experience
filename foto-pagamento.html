<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Fotografia</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#000;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}
  .back{
  font-size:14px;
  opacity:.45;
  text-decoration:none;
  color:#ffffff;
  transition:opacity .2s ease;
}

.back:hover{
  opacity:.8;
}


.container{
  max-width:520px;
  width:90%;
}

h1{
  font-size:34px;
  margin-bottom:10px;
}

.subtitle{
  opacity:.75;
  margin-bottom:24px;
  line-height:1.5;
}

.qr{
  background:#111;
  border:1px solid #333;
  border-radius:22px;
  padding:24px;
  display:flex;
  justify-content:center;
}

.qr img{
  width:260px;
  border-radius:12px;
}

.note{
  margin-top:22px;
  opacity:.7;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>Pagamento Fotografia</h1>

<p class="subtitle">
Escaneie o QR Code abaixo e informe o valor<br>
de acordo com a opção escolhida.
</p>

<div class="qr">
  <img src="qrcode.png" alt="QR Code Pix">
</div>

<p class="note">
Após o pagamento, mostre a confirmação ao motorista<br>
para realizar sua fotografia durante a viagem.
</p>
  <a href="javascript:history.back()" class="back">Voltar</a>


</div>

</body>
</html>
