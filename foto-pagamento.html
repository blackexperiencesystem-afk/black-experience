<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento da Fotografia</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#0b0b0b;
  color:#ffffff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.container{
  max-width:520px;
  width:90%;
}

h1{
  font-size:32px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.subtitle{
  opacity:.7;
  margin-bottom:24px;
  line-height:1.5;
}

.qr-box{
  background:#111;
  border:1px solid #333;
  border-radius:22px;
  padding:24px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.qr-box img{
  width:260px;
  height:auto;
  border-radius:14px;
}

.price{
  margin-top:18px;
  font-size:22px;
  font-weight:bold;
}

.note{
  margin-top:18px;
  font-size:14px;
  opacity:.6;
  line-height:1.4;
}
</style>
</head>

<body>

<div class="container">

<h1>Pagamento da Fotografia</h1>

<p class="subtitle">
Escaneie o QR Code abaixo para realizar o pagamento  
do retrato executivo escolhido.
</p>

<div class="qr-box">
  <img src="qrcode-foto.png" alt="QR Code Fotografia">
</div>

<div class="price">
Valor conforme opção selecionada
</div>

<p class="note">
Após o pagamento, mostre a confirmação ao motorista  
para iniciar a fotografia durante a viagem.
</p>

</div>

</body>
</html>
