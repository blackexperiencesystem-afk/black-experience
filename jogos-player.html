<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container {
    padding: 40px 24px;
}

/* ANIMAÇÃO DE ENTRADA */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.menu {
    width:100%;
    display:flex;
    flex-direction:column;
    gap:28px;
    margin-top:30px;
}

/* BOTÕES PRINCIPAIS */
.btn-game {
    padding:22px;
    border-radius:60px;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    border:1px solid rgba(212,175,55,0.45);
    background:radial-gradient(circle at top,#f1d27a 0%,#d4af37 40%,#b89b30 100%);
    color:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;

    animation: fadeUp .5s ease both;
}

.btn-game:nth-child(2){
    animation-delay: .06s;
}

.btn-game:active {
    transform:scale(0.97);
    box-shadow:0 6px 18px rgba(212,175,55,0.35);
    filter:brightness(1.05);
}

/* BOTÃO SOLICITAR CONTROLE */
.btn-control {
    padding:18px;
    border-radius:40px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    border:1px solid #2a2a2a;
    background:#0b0b0b;
    color:#fff;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;

    animation: fadeUp .5s ease both;
    animation-delay: .12s;
}

.btn-control.clicked {
    border-color:#d4af37;
    box-shadow:
        0 0 10px rgba(212,175,55,0.7),
        0 0 22px rgba(212,175,55,0.35);
    transform:scale(0.97);
}

/* TOAST ELEGANTE */
.toast {
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(12px);
    background:rgba(20,20,20,0.92);
    border:1px solid rgba(212,175,55,.45);
    padding:12px 18px;
    border-radius:16px;
    font-size:13px;
    letter-spacing:.2px;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .35s ease,
        transform .35s ease;
}

.toast.show {
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
</style>

</head>

<body>

<div class="container">

  <h1>Modo Jogos</h1>

  <div class="subtitle">
    Clássicos atemporais.<br>
    Experiência de console em movimento.
  </div>

  <div class="menu">

    <div class="btn-game" onclick="abrirPS2()">
      🎮 PlayStation 2
    </div>

    <div class="btn-game" onclick="abrirN64()">
      🕹️ Nintendo 64
    </div>

    <div class="btn-control" onclick="solicitarControle(this)">
      🎮 Solicitar controle ao motorista
    </div>

  </div>

  <div class="back" onclick="goBack()">← voltar</div>

</div>

<div class="toast" id="toast">Controle solicitado ao motorista ✔</div>

<script src="assets/ui.js"></script>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxdD0XLWukDPjhOZXOKoI4nMgmwjzjshAIGpkTk8fFp0n3e70Ncf8FfUK_Jdbyi5XN5ZQ/exec";

function abrirPS2(){
    if(typeof fully !== "undefined"){
        fully.startApplication("xyz.aethersx2.android");
    }
}

function abrirN64(){
    if(typeof fully !== "undefined"){
        fully.startApplication("com.swordfish.lemuroid");
    }
}

function solicitarControle(btn){

    /* glow suave */
    btn.classList.add("clicked");
    setTimeout(()=>btn.classList.remove("clicked"), 500);

    /* envia telegram */
    fetch(scriptURL,{
        method:"POST",
        body:new URLSearchParams({
            executivo:"🎮 Passageiro solicitou controle do videogame"
        })
    });

    /* toast elegante */
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"), 2000);
}
</script>

</body>
</html>
