<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos Premium</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

h1{
    font-size:30px;
    margin-bottom:10px;
}

p{
    opacity:.7;
    margin-bottom:28px;
    line-height:1.4;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:28px;
}

.card{
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    padding:16px 10px;
    font-size:14px;
    opacity:.9;
}

.card span{
    display:block;
    font-size:20px;
    margin-bottom:6px;
}

.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:30px;
    font-size:16px;
    font-weight:600;
    background:linear-gradient(135deg,#e5c15a,#cfa73a);
    color:#000;
    margin-bottom:16px;
}

.voltar{
    font-size:13px;
    opacity:.5;
    text-decoration:none;
    color:#fff;
}
</style>
</head>

<body>

<div class="container">

<h1>Jogos Premium</h1>

<p>
Relaxe durante a viagem com clássicos do videogame.
Escolha seu favorito e aproveite a experiência no tablet.
</p>

<div class="grid">
    <div class="card"><span>🚗</span>GTA San Andreas</div>
    <div class="card"><span>🏁</span>Mario Kart</div>
    <div class="card"><span>⚽</span>Futebol Retrô</div>
    <div class="card"><span>🎮</span>N64 & PlayStation</div>
</div>

<button class="btn" onclick="iniciarJogo()">
Iniciar no tablet
</button>

<a class="voltar" href="vip.html">Voltar ao menu premium</a>

</div>


<script>
function iniciarJogo(){
    alert("O motorista irá iniciar o jogo no tablet para você. Aproveite a experiência 🎮");
}
</script>

</body>
</html>
