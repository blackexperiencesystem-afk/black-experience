<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Black Experience System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #111 0%, #000 60%);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 20px;
      letter-spacing: 2px;
      font-size: 28px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      width: 90%;
      max-width: 1200px;
    }

    .game {
      background: linear-gradient(180deg, #1a1a1a, #0a0a0a);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }

    .game:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .ps2 {
      border: 2px solid #2b6cff;
    }

    .n64 {
      border: 2px solid #2bff9e;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <h1>🎮 BLACK EXPERIENCE SYSTEM</h1>

  <div class="grid">

    <a class="botao" onclick="abrirPS2()">GTA San Andreas</a>
<a class="botao" onclick="abrirPS2()">God of War</a>
<a class="botao" onclick="abrirPS2()">FIFA Street 2</a>
<a class="botao" onclick="abrirPS2()">Guitar Hero III</a>
<a class="botao" onclick="abrirPS2()">Need for Speed</a>
<a class="botao" onclick="abrirPS2()">Winning Eleven 9</a>

<a class="botao secundario" onclick="abrirN64()">Super Mario 64</a>
<a class="botao secundario" onclick="abrirN64()">Mario Kart 64</a>


  </div>

  <div class="footer">
    Sistema dedicado • Toque para jogar
  </div>

 <script>
function abrirPS2(){
    if (typeof fully !== "undefined") {
        fully.startApplication("xyz.aethersx2.android");
    }
}

function abrirN64(){
    if (typeof fully !== "undefined") {
        fully.startApplication("com.swordfish.lemuroid");
    }
}
</script>



</body>
</html>
