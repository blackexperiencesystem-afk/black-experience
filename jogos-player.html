<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
/* Ajustes específicos da página Jogos */
.container {
    padding: 40px 24px;
}

.menu {
    width:100%;
    display:flex;
    flex-direction:column;
    gap:28px;
    margin-top:30px;
}

.btn-game {
    padding:22px;
    border-radius:60px;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    border:1px solid rgba(212,175,55,0.45);
    background:radial-gradient(circle at top,#f1d27a 0%,#d4af37 40%,#b89b30 100%);
    color:#000;
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex;
    justify-content:center;
    align-items:center;
}

.btn-game:active {
    transform:scale(0.97);
}

.btn-game span {
    display:block;
    font-size:14px;
    font-weight:normal;
    margin-top:6px;
    color:#3a2e00;
}
</style>

</head>

<body>

<div class="container">

  <h1>Modo Jogos</h1>

  <div class="subtitle">
    Clássicos atemporais.<br>
    Experiência de console em movimento.
  </div>

  <div class="menu">

    <div class="btn-game" onclick="abrirPS2()">
      🎮 PlayStation 2
    </div>

    <div class="btn-game" onclick="abrirN64()">
      🕹️ Nintendo 64
    </div>

  </div>

  <div class="back" onclick="goBack()">← voltar</div>

</div>

<script src="assets/ui.js"></script>

<script>
function abrirPS2(){
    if(typeof fully !== "undefined"){
        fully.startApplication("xyz.aethersx2.android");
    }
}

function abrirN64(){
    if(typeof fully !== "undefined"){
        fully.startApplication("com.swordfish.lemuroid");
    }
}
</script>

</body>
</html>
