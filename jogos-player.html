<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
/* Ajustes específicos da página Jogos */
.container {
    padding: 40px 24px;
}

.menu {
    width:100%;
    display:flex;
    flex-direction:column;
    gap:28px;
    margin-top:30px;
}

.btn-game {
    padding:22px;
    border-radius:60px;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    border:1px solid rgba(212,175,55,0.45);
    background:radial-gradient(circle at top,#f1d27a 0%,#d4af37 40%,#b89b30 100%);
    color:#000;
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex;
    justify-content:center;
    align-items:center;
}

.btn-game:active {
    transform:scale(0.97);
}

.btn-game span {
    display:block;
    font-size:14px;
    font-weight:normal;
    margin-top:6px;
    color:#3a2e00;
}

/* BOTÃO SOLICITAR CONTROLE — mesmo estilo visual */
.btn-control {
    padding:18px;
    border-radius:40px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    border:1px solid #2a2a2a;
    background:#0b0b0b;
    color:#fff;
    transition:.2s;
}

.btn-control.clicked {
    border-color:#d4af37;
    box-shadow:
        0 0 12px rgba(212,175,55,0.7),
        0 0 24px rgba(212,175,55,0.35);
    transform:scale(0.97);
}

/* TOAST DISCRETO */
.toast {
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#111;
    border:1px solid rgba(212,175,55,.5);
    padding:12px 16px;
    border-radius:14px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.35s;
}

.toast.show {
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
</style>

</head>

<body>

<div class="container">

  <h1>Modo Jogos</h1>

  <div class="subtitle">
    Clássicos atemporais.<br>
    Experiência de console em movimento.
  </div>

  <div class="menu">

    <div class="btn-game" onclick="abrirPS2()">
      🎮 PlayStation 2
    </div>

    <div class="btn-game" onclick="abrirN64()">
      🕹️ Nintendo 64
    </div>

    <!-- NOVO BOTÃO SEM ALTERAR LAYOUT -->
    <div class="btn-control" onclick="solicitarControle(this)">
      🎮 Solicitar controle ao motorista
    </div>

  </div>

  <div class="back" onclick="goBack()">← voltar</div>

</div>

<div class="toast" id="toast">Controle solicitado ao motorista ✔</div>

<script src="assets/ui.js"></script>

<script>
const scriptURL = "COLE_AQUI_SUA_URL_DO_WEBAPP";

function abrirPS2(){
    if(typeof fully !== "undefined"){
        fully.startApplication("xyz.aethersx2.android");
    }
}

function abrirN64(){
    if(typeof fully !== "undefined"){
        fully.startApplication("com.swordfish.lemuroid");
    }
}

function solicitarControle(btn){

    /* brilho suave */
    btn.classList.add("clicked");
    setTimeout(()=>btn.classList.remove("clicked"), 600);

    /* envia para Telegram */
    fetch(scriptURL,{
        method:"POST",
        body:new URLSearchParams({
            executivo:"🎮 Passageiro solicitou controle do videogame"
        })
    });

    /* aviso visual */
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"), 2200);
}
</script>

</body>
</html>
