<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conforto Premium</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:500px;
    text-align:center;
}

h1{
    font-size:34px;
    margin-bottom:8px;
}

.sub{
    opacity:.6;
    margin-bottom:30px;
}

.grupo{
    margin-bottom:28px;
}

.botao-opcao{
    display:block;
    width:100%;
    margin:10px 0;
    padding:16px;
    border-radius:16px;
    border:1px solid #333;
    background:#0b0b0b;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.botao-opcao:hover{
    background:#151515;
}

.botao-opcao.selecionado{
    border-color:#d4af37;
    background:#1a1405;
}

.confirmar{
    margin-top:20px;
    display:block;
    width:100%;
    padding:18px;
    border-radius:40px;
    border:none;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
}

.voltar{
    margin-top:18px;
    font-size:13px;
    opacity:.5;
    text-decoration:none;
    color:#fff;
    display:inline-block;
}
</style>
</head>

<body>

<div class="container">

<h1>Conforto Premium</h1>
<div class="sub">Ajuste o clima e escolha seus itens</div>

<!-- CLIMATIZAÇÃO -->
<div class="grupo">
<b>Climatização</b>

<button class="botao-opcao" onclick="selecionarClima(this,'Mais frio')">❄️ Mais frio</button>
<button class="botao-opcao" onclick="selecionarClima(this,'Padrão')">🌡️ Padrão</button>
<button class="botao-opcao" onclick="selecionarClima(this,'Mais quente')">🔥 Mais quente</button>
<button class="botao-opcao" onclick="selecionarClima(this,'Ar desligado')">🚫 Ar desligado</button>
</div>

<!-- ITENS -->
<div class="grupo">
<b>Escolha até 2 itens</b>

<button class="botao-opcao" onclick="toggleItem(this,'Água sem gás')">💧 Água sem gás</button>
<button class="botao-opcao" onclick="toggleItem(this,'Água com gás')">🥤 Água com gás</button>
<button class="botao-opcao" onclick="toggleItem(this,'Mini Coca-Cola')">🥤 Mini Coca-Cola</button>
<button class="botao-opcao" onclick="toggleItem(this,'Mini Ruffles')">🍟 Mini Ruffles</button>
<button class="botao-opcao" onclick="toggleItem(this,'KitKat')">🍫 KitKat</button>
<button class="botao-opcao" onclick="toggleItem(this,'Amendoim')">🥜 Amendoim</button>
</div>

<button class="confirmar" onclick="enviarPedido()">Confirmar pedido</button>

<a class="voltar" href="vip.html">Voltar</a>

</div>

<script>
let climaEscolhido = "";
let itens = [];

function selecionarClima(botao, valor){
    climaEscolhido = valor;

    document.querySelectorAll(".grupo:first-of-type .botao-opcao")
        .forEach(b => b.classList.remove("selecionado"));

    botao.classList.add("selecionado");
}

function toggleItem(botao, valor){

    if(itens.includes(valor)){
        itens = itens.filter(i => i !== valor);
        botao.classList.remove("selecionado");
        return;
    }

    if(itens.length >= 2){
        alert("Escolha no máximo 2 itens.");
        return;
    }

    itens.push(valor);
    botao.classList.add("selecionado");
}

function enviarPedido(){

    if(!climaEscolhido){
        alert("Selecione a climatização.");
        return;
    }

    if(itens.length === 0){
        alert("Escolha pelo menos 1 item.");
        return;
    }

    const mensagem =
`Pedido Black Experience:

Climatização: ${climaEscolhido}
Itens: ${itens.join(", ")}`;

    const telefone = "5511982682148";

    const url = `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;

    window.location.href = url;
}
</script>

</body>
</html>
