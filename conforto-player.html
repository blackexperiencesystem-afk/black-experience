<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conforto Premium</title>

<link rel="stylesheet" href="assets/style.css">

<style>
body{
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.container{
  max-width:480px;
  margin:0 auto;
  padding:48px 22px 80px;
}

/* TITULOS */
h1{
  font-size:34px;
  font-weight:600;
  text-align:center;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  opacity:.7;
  margin-bottom:36px;
}

.section-title{
  margin:32px 0 12px;
  font-size:14px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#d4af37;
  opacity:.9;
}

/* BOTÕES */
.section{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.btn{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:1px solid #2a2a2a;
  background:linear-gradient(180deg,#0c0c0c,#050505);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.25s ease;
}

.btn:hover{
  border-color:#444;
}

.btn.selected{
  border-color:#d4af37;
  background:linear-gradient(180deg,#1b1406,#0d0902);
  box-shadow:0 0 0 1px rgba(212,175,55,.3), 0 6px 20px rgba(212,175,55,.15);
}

/* BOTÃO CONFIRMAR */
.confirm{
  margin-top:36px;
  width:100%;
  padding:20px;
  border:none;
  border-radius:50px;
  font-size:18px;
  font-weight:600;
  background:linear-gradient(135deg,#d4af37,#f1d27a);
  color:#000;
  cursor:pointer;
  transition:.25s;
}

.confirm:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 24px rgba(212,175,55,.35);
}

/* MENSAGEM OK */
.ok{
  display:none;
  margin-top:18px;
  text-align:center;
  font-size:14px;
  opacity:.75;
}

/* VOLTAR */
.back{
  margin-top:28px;
  text-align:center;
  opacity:.5;
  cursor:pointer;
  font-size:14px;
}
.back:hover{ opacity:.9; }
</style>
</head>

<body>

<div class="container">

<h1>Conforto</h1>
<div class="subtitle">Ajuste o ambiente da cabine</div>

<!-- AR CONDICIONADO -->
<div class="section-title">Ar condicionado</div>

<div class="section">
  <button class="btn" onclick="select(this,'clima','Mais frio')">❄️ Mais frio</button>
  <button class="btn" onclick="select(this,'clima','Padrão')">🌡️ Padrão</button>
  <button class="btn" onclick="select(this,'clima','Mais quente')">🔥 Mais quente</button>
  <button class="btn" onclick="select(this,'clima','Desligado')">⛔ Desligado</button>
</div>

<!-- AROMATIZADOR -->
<div class="section-title">Aromatizador</div>

<div class="section">
  <button class="btn" onclick="select(this,'aroma','Ligado')">🌿 Aroma ligado</button>
  <button class="btn" onclick="select(this,'aroma','Desligado')">🚫 Aroma desligado</button>
</div>

<button class="confirm" onclick="enviar()">Confirmar preferências</button>

<div class="ok" id="ok">Preferências enviadas com sucesso ✔</div>

<div class="back" onclick="history.back()">← voltar</div>

</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycby_zbIn5uEdlBhk-1F9SGQ5jiDbWb3Zks8Yzn859i-SIwjpM-NBBk6dSGFzgiOgGDfM7A/exec";

let clima="", aroma="";

function select(btn,tipo,valor){
  btn.parentElement.querySelectorAll(".btn").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");

  if(tipo==="clima") clima = valor;
  if(tipo==="aroma") aroma = valor;
}

function enviar(){
  if(!clima || !aroma){
    alert("Selecione climatização e aromatização.");
    return;
  }

  fetch(scriptURL,{
    method:"POST",
    body:new URLSearchParams({ clima, aroma })
  });

  document.getElementById("ok").style.display="block";
}
</script>

</body>
</html>
