<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conforto Premium</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

.wrapper{
    max-width:520px;
    margin:0 auto;
    padding:40px 20px 80px;
    text-align:center;
}

h1{
    font-size:34px;
    margin-bottom:6px;
}

.sub{
    opacity:.55;
    font-size:15px;
    margin-bottom:32px;
}

.grupo{
    margin-bottom:30px;
    text-align:left;
}

.titulo{
    font-weight:600;
    margin-bottom:4px;
}

.desc{
    font-size:13px;
    opacity:.45;
    margin-bottom:12px;
}

.opcao{
    display:block;
    width:100%;
    margin:8px 0;
    padding:15px;
    border-radius:14px;
    border:1px solid #2a2a2a;
    background:#0b0b0b;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

.opcao.selecionado{
    border-color:#d4af37;
    background:#1a1405;
}

/* BOTÃO CONFIRMAR */
.confirmar{
    margin-top:18px;
    width:100%;
    padding:18px;
    border:none;
    border-radius:40px;
    font-size:18px;
    font-weight:600;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    cursor:pointer;
}

/* MENSAGEM OK */
.ok{
    display:none;
    margin-top:18px;
    font-size:15px;
    opacity:.85;
}

/* BOTÃO CONTINUAR PREMIUM */
.gold-button{
    display:none;
    margin-top:22px;
    width:100%;
    padding:20px;
    border-radius:40px;
    font-size:18px;
    font-weight:700;
    text-decoration:none;
    text-align:center;

    background:linear-gradient(
        135deg,
        #d4af37 0%,
        #f1d27a 50%,
        #d4af37 100%
    );

    color:#000;
    box-shadow:
        0 10px 30px rgba(212,175,55,0.35),
        inset 0 1px 0 rgba(255,255,255,0.35);
}

.gold-button:active{
    transform:scale(0.97);
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Conforto Premium</h1>
<div class="sub">Personalize o ambiente da sua viagem</div>

<!-- CLIMATIZAÇÃO -->
<div class="grupo">
    <div class="titulo">Climatização</div>
    <div class="desc">Escolha apenas uma opção de temperatura.</div>

    <button class="opcao" onclick="selectSingle(this,'clima','Mais frio')">❄️ Mais frio</button>
    <button class="opcao" onclick="selectSingle(this,'clima','Padrão')">🌡️ Padrão</button>
    <button class="opcao" onclick="selectSingle(this,'clima','Mais quente')">🔥 Mais quente</button>
    <button class="opcao" onclick="selectSingle(this,'clima','Ar desligado')">🚫 Ar desligado</button>
</div>

<!-- AROMATIZAÇÃO -->
<div class="grupo">
    <div class="titulo">Aromatização</div>
    <div class="desc">Controle o difusor aromático do ambiente.</div>

    <button class="opcao" onclick="selectSingle(this,'aroma','Ligado')">🌿 Difusor ligado</button>
    <button class="opcao" onclick="selectSingle(this,'aroma','Desligado')">⛔ Difusor desligado</button>
</div>

<!-- BEBIDAS & SNACKS -->
<div class="grupo">
    <div class="titulo">Bebidas & Snacks</div>
    <div class="desc">Selecione até dois itens disponíveis.</div>

    <button class="opcao" onclick="toggleItem(this,'Água sem gás')">💧 Água sem gás</button>
    <button class="opcao" onclick="toggleItem(this,'Água com gás')">🥤 Água com gás</button>
    <button class="opcao" onclick="toggleItem(this,'Mini Coca-Cola')">🥤 Mini Coca-Cola</button>
    <button class="opcao" onclick="toggleItem(this,'Mini Ruffles')">🍟 Mini Ruffles</button>
    <button class="opcao" onclick="toggleItem(this,'KitKat')">🍫 KitKat</button>
    <button class="opcao" onclick="toggleItem(this,'Amendoim')">🥜 Amendoim</button>
</div>

<button class="confirmar" onclick="enviar()">Confirmar pedido</button>

<div class="ok" id="ok">Pedido enviado ao motorista ✔</div>

<a href="vip.html" class="gold-button" id="premiumBtn">
    ⭐ Continuar Experiência Premium
</a>

</div>

<script>
let clima="", aroma="", itens=[];

function selectSingle(btn, tipo, valor){
    let grupo = btn.parentElement.querySelectorAll(".opcao");
    grupo.forEach(b=>b.classList.remove("selecionado"));
    btn.classList.add("selecionado");

    if(tipo==="clima") clima = valor;
    if(tipo==="aroma") aroma = valor;
}

function toggleItem(btn, valor){
    if(itens.includes(valor)){
        itens = itens.filter(i=>i!==valor);
        btn.classList.remove("selecionado");
        return;
    }

    if(itens.length>=2){
        alert("Escolha no máximo 2 itens.");
        return;
    }

    itens.push(valor);
    btn.classList.add("selecionado");
}

function enviar(){

    if(!clima){ alert("Selecione a climatização."); return; }
    if(!aroma){ alert("Selecione a aromatização."); return; }

    const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSfu2RVjCX-ocfrzTB5TruBUuWaG6FB32AW5AbBCjPdmSh3DZQ/formResponse";

    const data = new FormData();
    data.append("entry.1771049017", clima);
    data.append("entry.1800625", aroma);
    data.append("entry.1927228480", itens.join(", "));

    fetch(formURL, { method:"POST", mode:"no-cors", body:data });

    document.getElementById("ok").style.display="block";
    document.getElementById("premiumBtn").style.display="block";
}
</script>

</body>
</html>
