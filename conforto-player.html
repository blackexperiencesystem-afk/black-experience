<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conforto Premium</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{ padding:48px 22px 80px; }
.section{ margin-bottom:28px; text-align:left; }

.btn{
  width:100%;
  padding:18px;
  margin:8px 0;
  border-radius:16px;
  border:1px solid #2a2a2a;
  background:#0b0b0b;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.btn.selected{
  border-color:#d4af37;
  background:#1a1405;
}

.confirm{
  margin-top:20px;
  width:100%;
  padding:18px;
  border:none;
  border-radius:40px;
  font-size:18px;
  font-weight:600;
  background:linear-gradient(135deg,#d4af37,#f1d27a);
  color:#000;
  cursor:pointer;
}

.ok{
  display:none;
  margin-top:16px;
  font-size:14px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="container">

<h1>Conforto</h1>
<div class="subtitle">Ajuste o ambiente da cabine</div>

<!-- CLIMA -->
<div class="section">
<button class="btn" onclick="select(this,'clima','Mais frio')">❄️ Mais frio</button>
<button class="btn" onclick="select(this,'clima','Padrão')">🌡️ Padrão</button>
<button class="btn" onclick="select(this,'clima','Mais quente')">🔥 Mais quente</button>
</div>

<!-- AROMA -->
<div class="section">
<button class="btn" onclick="select(this,'aroma','Ligado')">🌿 Aroma ligado</button>
<button class="btn" onclick="select(this,'aroma','Desligado')">⛔ Aroma desligado</button>
</div>

<button class="confirm" onclick="enviar()">Confirmar</button>

<div class="ok" id="ok">Preferências enviadas ✔</div>

<div class="back" onclick="goBack()">← voltar</div>

</div>

<script src="assets/ui.js"></script>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxr5hzq91fHkqdlDUCg6MLQ89TE-11dzQoziNST7AWp4q6h302mB1mg4vOmOvQjo7svng/exec";

let clima="", aroma="";

function select(btn,tipo,valor){
  btn.parentElement.querySelectorAll(".btn").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");

  if(tipo==="clima") clima = valor;
  if(tipo==="aroma") aroma = valor;
}

function enviar(){
  if(!clima || !aroma){
    alert("Selecione climatização e aromatização.");
    return;
  }

  fetch(scriptURL,{
    method:"POST",
    body:new URLSearchParams({ clima, aroma })
  });

  document.getElementById("ok").style.display="block";
}
</script>

</body>
</html>
