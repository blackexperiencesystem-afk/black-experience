<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar Passe Premium</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#0b0b0b;
  color:#ffffff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.back{
  font-size:14px;
  opacity:.45;
  text-decoration:none;
  color:#ffffff;
  transition:opacity .2s ease;
}
.back:hover{ opacity:.8; }

.hidden-activate{
  position:fixed;
  top:0;
  right:0;
  width:80px;
  height:80px;
  opacity:0;
  z-index:999;
}

h1{ font-size:34px; margin-bottom:10px; letter-spacing:2px; }

p{
  opacity:0.7;
  max-width:420px;
  margin-bottom:24px;
  line-height:1.5;
}

.qr-box{
  background:#111;
  border:1px solid #333;
  border-radius:22px;
  padding:24px;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:280px;
}

.qr-box img{
  width:260px;
  height:auto;
  border-radius:16px;
  display:none;
}

.loading{
  opacity:.6;
  font-size:14px;
}

.info{
  margin-top:24px;
  opacity:.7;
  font-size:15px;
}
</style>
</head>

<body>

<h1>Ativar Passe Premium</h1>

<p>
Escaneie o QR Code abaixo para realizar o pagamento via Pix  
e liberar sua experiência premium nesta viagem.
</p>

<div class="qr-box">
  <div id="loading" class="loading">Gerando QR Code Pix…</div>
  <img id="qr" alt="QR Code Pix">
</div>

<div class="info">
Após o pagamento, a liberação será automática.
</div>

<a href="javascript:history.back()" class="back">Voltar</a>

<a href="boas-vindas.html" class="hidden-activate" id="ativar"></a>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYPUANWT-uItieLyZ4dvF7mCcRtQbuZiUrt4M8rGfn825JeUbHY1v-xhc9d5OTq0HkHQ/exec";

const nome = localStorage.getItem("nome") || "Cliente";
const telefone = localStorage.getItem("telefone") || "000";

/* ===== GERAR QR PIX ===== */
fetch(`${SCRIPT_URL}?acao=pix&nome=${nome}&telefone=${telefone}`)
.then(r => r.json())
.then(d => {
  document.getElementById("qr").src = "data:image/png;base64," + d.qr;
  document.getElementById("qr").style.display = "block";
  document.getElementById("loading").style.display = "none";
});

/* ===== VERIFICAR PAGAMENTO AUTOMÁTICO ===== */
setInterval(() => {

  fetch(`${SCRIPT_URL}?acao=status&telefone=${telefone}`)
  .then(r => r.text())
  .then(status => {

    if(status === "pago"){
      window.location.href = "boas-vindas.html";
    }

  });

}, 4000); // verifica a cada 4s
</script>

</body>
</html>
