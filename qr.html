<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ativar Passe Premium</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.container {
  text-align: center;
  max-width: 400px;
}

h1 {
  font-weight: 600;
  margin-bottom: 10px;
}

p {
  color: #aaa;
  font-size: 14px;
}

.qr-box {
  margin: 30px auto;
  width: 240px;
  height: 240px;
  border-radius: 20px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr-box img {
  width: 200px;
}

.codigo {
  background: #111;
  padding: 10px;
  border-radius: 10px;
  font-size: 12px;
  word-break: break-all;
  margin-top: 15px;
}

.status {
  margin-top: 20px;
  font-size: 14px;
  color: #0f0;
}

.link-voltar {
  display: block;
  margin-top: 25px;
  color: #888;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Ativar Passe Premium</h1>
<p>Escaneie o QR Code abaixo para pagar via Pix e liberar sua experiência premium.</p>

<div class="qr-box" id="qrBox">
  <span>Gerando QR Code...</span>
</div>

<div class="codigo" id="codigoPix"></div>
<div class="status" id="statusPagamento"></div>

<a class="link-voltar" href="index.html">Voltar</a>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwpe5jOq5tmlFBlqpZ6Y_IsnbcWJntEoOl0YhaKCRNo2Nr48B-0MLaIsfjdZ8Ihtmmm/exec";

let paymentId = null;

/* ================= GERAR PIX ================= */
async function gerarPix() {
  const res = await fetch(API_URL + "?action=criar_pix");
  const data = await res.json();

  paymentId = data.id;

  document.getElementById("qrBox").innerHTML =
    `<img src="data:image/png;base64,${data.qr_code_base64}">`;

  document.getElementById("codigoPix").innerText =
    data.qr_code;

  verificarPagamento();
}

/* ================= VERIFICAR PAGAMENTO ================= */
async function verificarPagamento() {
  const intervalo = setInterval(async () => {

    const res = await fetch(API_URL + "?action=verificar&id=" + paymentId);
    const data = await res.json();

    if (data.status === "approved") {
      clearInterval(intervalo);

      document.getElementById("statusPagamento").innerText =
        "Pagamento aprovado! Liberando acesso...";

      setTimeout(() => {
        window.location.href = "boas-vindas.html?token=" + data.token;
      }, 1500);
    }

  }, 4000);
}

/* iniciar automaticamente */
gerarPix();
</script>

</body>
</html>
