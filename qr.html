<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar Passe Premium</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.container {
  text-align: center;
  max-width: 400px;
}

h1 {
  margin-bottom: 10px;
}

p {
  color: #aaa;
}

.qr-box {
  margin: 30px auto;
  padding: 20px;
  background: #111;
  border-radius: 20px;
  width: 260px;
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<div class="container">

  <h1>Ativar Passe Premium</h1>
  <p>Escaneie o QR Code abaixo para pagar via Pix e liberar sua experiência.</p>

  <div class="qr-box">
    <!-- AQUI FICA O QR CODE -->
    <img id="qr" width="220">
  </div>

  <p>A liberação acontece automaticamente após o pagamento.</p>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxpfMCe1AqUSt1e3YM-8S7kUtOzWLNTxpDtslOoQbcd0xGuPxtZCJ98VJIpFSTZpz0_/exec";

let paymentId = null;

/* CRIAR PIX */
async function gerarPix() {
  const res = await fetch(API_URL + "?action=criar_pix");
  const data = await res.json();

  paymentId = data.id;

  document.getElementById("qr").src =
    "data:image/png;base64," + data.qr_code_base64;

  verificarPagamento();
}

/* VERIFICAR PAGAMENTO AUTOMÁTICO */
function verificarPagamento() {
  const intervalo = setInterval(async () => {

    const res = await fetch(API_URL + "?action=verificar_pagamento&id=" + paymentId);
    const data = await res.json();

    if (data.status === "approved") {
      clearInterval(intervalo);
      window.location.href = "boas-vindas.html";
    }

  }, 4000);
}

gerarPix();
</script>

</body>
</html>
