<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar Passe Premium</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.container{
  text-align:center;
  max-width:400px;
  padding:20px;
}

h1{
  margin-bottom:10px;
}

p{
  color:#aaa;
}

.qr-box{
  margin:30px auto;
  padding:20px;
  background:#111;
  border-radius:20px;
  width:260px;
  height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.status{
  margin-top:15px;
  font-size:14px;
  color:#0f0;
}
</style>
</head>

<body>

<div class="container">

  <h1>Ativar Passe Premium</h1>
  <p>Escaneie o QR Code abaixo para liberar sua experiência VIP.</p>

  <div class="qr-box">
    <img id="qr" width="220">
  </div>

  <p class="status" id="status">Gerando pagamento…</p>

</div>

<script>
/* ===== URL DO APPS SCRIPT ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbxgi6v702Fo5bWn6qzJIYkerWYsMG7VSRitmGhWaX7I0LOl7KNIhKTd1xcXEbMxBIZ8/exec";

let paymentId = null;

/* ========= CRIAR PIX ========= */
async function gerarPix(){
  try{
    const res = await fetch(API_URL + "?action=criar_pix");
    const data = await res.json();

    paymentId = data.id;

    document.getElementById("qr").src =
      "data:image/png;base64," + data.qr_code_base64;

    document.getElementById("status").innerText =
      "Aguardando pagamento…";

    verificarPagamento();

  }catch(e){
    document.getElementById("status").innerText =
      "Erro ao gerar pagamento.";
  }
}

/* ========= VERIFICAR PAGAMENTO ========= */
function verificarPagamento(){

  const intervalo = setInterval(async () => {

    try{
      const res = await fetch(
        API_URL + "?action=verificar_pagamento&id=" + paymentId
      );

      const data = await res.json();

      if(data.status === "approved"){
        clearInterval(intervalo);

        document.getElementById("status").innerText =
          "Pagamento aprovado! Liberando acesso…";

        /* 🔐 REDIRECIONA PARA A PÁGINA VIP COM TOKEN */
        setTimeout(() => {
          window.location.href =
            "boas-vindas-vip.html?token=" + data.token;
        }, 1500);
      }

    }catch(e){
      console.log("Erro ao verificar pagamento");
    }

  }, 4000);
}

/* ========= INICIAR ========= */
gerarPix();
</script>

</body>
</html>
