<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiência VIP</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #111 0%, #000 70%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  text-align: center;
}

.container {
  max-width: 420px;
  padding: 30px;
  animation: fadeIn 1.2s ease;
}

h1 {
  font-size: 28px;
  margin-bottom: 12px;
}

p {
  color: #bbb;
  margin-bottom: 30px;
}

.button {
  display: none;
  padding: 16px 28px;
  border-radius: 40px;
  background: linear-gradient(135deg, #00ff99, #00cc66);
  color: #000;
  font-weight: 600;
  text-decoration: none;
  font-size: 16px;
  box-shadow: 0 0 20px rgba(0,255,153,0.25);
}

.loader {
  margin: 20px auto;
  border: 4px solid #333;
  border-top: 4px solid #00ff99;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">

  <h1 id="titulo">Verificando seu acesso VIP...</h1>
  <p id="texto">Aguarde alguns segundos.</p>

  <div class="loader" id="loader"></div>

  <a class="button" id="btnEntrar" href="boas-vindas.html">
    Entrar na Experiência VIP
  </a>

</div>

<script>
/* ===== URL DO SEU APPS SCRIPT ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbxgi6v702Fo5bWn6qzJIYkerWYsMG7VSRitmGhWaX7I0LOl7KNIhKTd1xcXEbMxBIZ8/exec";

/* ===== PEGAR TOKEN DA URL ===== */
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

/* ===== BLOQUEAR ACESSO ===== */
function bloquear() {
  document.getElementById("titulo").innerText = "Acesso não autorizado";
  document.getElementById("texto").innerText =
    "Este acesso é exclusivo para clientes que realizaram o pagamento.";
  document.getElementById("loader").style.display = "none";
}

/* ===== LIBERAR ACESSO ===== */
function liberar() {
  document.getElementById("titulo").innerText =
    "Bem-vindo à sua Experiência VIP";
  document.getElementById("texto").innerText =
    "Personalize agora sua recepção a bordo.";
  document.getElementById("loader").style.display = "none";
  document.getElementById("btnEntrar").style.display = "inline-block";
}

/* ===== VALIDAR TOKEN NO SERVIDOR ===== */
async function validarToken() {

  if (!token) {
    bloquear();
    return;
  }

  try {
    const res = await fetch(
      API_URL + "?action=validar_token&token=" + token
    );

    const data = await res.json();

    if (data.valido === true) {
      liberar();
    } else {
      bloquear();
    }

  } catch (e) {
    bloquear();
  }
}

validarToken();
</script>

</body>
</html>
