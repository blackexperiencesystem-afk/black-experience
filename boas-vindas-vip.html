<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiência VIP</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #111 0%, #000 70%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  text-align: center;
}

.container {
  max-width: 420px;
  padding: 30px;
  animation: fadeIn 1.2s ease;
}

h1 {
  font-size: 28px;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

p {
  color: #bbb;
  font-size: 16px;
  margin-bottom: 40px;
}

.button {
  display: inline-block;
  padding: 16px 28px;
  border-radius: 40px;
  background: linear-gradient(135deg, #00ff99, #00cc66);
  color: #000;
  font-weight: 600;
  text-decoration: none;
  font-size: 16px;
  transition: all 0.3s ease;
  box-shadow: 0 0 20px rgba(0,255,153,0.25);
}

.button:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 0 30px rgba(0,255,153,0.45);
}

.lock {
  font-size: 42px;
  margin-bottom: 18px;
  opacity: 0.9;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">

  <div class="lock">🔓</div>

  <h1>Bem-vindo à sua Experiência VIP</h1>

  <p>Personalize agora sua recepção a bordo e prepare-se para um momento exclusivo.</p>

  <!-- BOTÃO PARA A PRÓXIMA ETAPA -->
  <a class="button" href="boas-vindas.html">
    Entrar na Experiência VIP
  </a>

</div>

</body>
</html>
