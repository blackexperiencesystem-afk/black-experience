<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar Sessão</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{
    padding:48px 22px 80px;
    text-align:center;
}

.form{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

input, select{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid #2a2a2a;
    background:#0b0b0b;
    color:#fff;
    font-size:15px;
}

button{
    margin-top:12px;
    padding:18px;
    border:none;
    border-radius:40px;
    font-size:18px;
    font-weight:600;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    cursor:pointer;
}

/* LOADING */
#loading{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    font-size:16px;
    letter-spacing:.4px;
    opacity:.92;
}
</style>
</head>

<body>

<div class="container">

<h1>Solicitar Sessão</h1>

<div class="subtitle">
Preencha os dados para agendar sua experiência fotográfica.
</div>

<form class="form" onsubmit="enviar(event)">

<input
type="text"
id="nome"
placeholder="Seu nome"
required
>

<input
type="email"
id="email"
placeholder="Seu email"
required
>

<input
type="tel"
id="telefone"
placeholder="(00)00000-0000"
maxlength="15"
required
oninput="formatarTelefone(this)"
>

<select id="estilo" required>
<option value="">Estilo de fotografia</option>
<option>Ensaio externo</option>
<option>Executivo</option>
<option>Casal</option>
<option>Black Experience</option>
</select>

<button type="submit">Enviar solicitação</button>

</form>

</div>

<div id="loading">Carregando solicitação…</div>

<script>
const scriptURL = "COLE_AQUI_SUA_URL_DO_WEBAPP";

/* MÁSCARA TELEFONE */
function formatarTelefone(input){
    let v = input.value.replace(/\D/g,"");

    if(v.length > 11) v = v.slice(0,11);

    if(v.length > 6){
        v = `(${v.slice(0,2)})${v.slice(2,7)}-${v.slice(7)}`;
    } else if(v.length > 2){
        v = `(${v.slice(0,2)})${v.slice(2)}`;
    } else if(v.length > 0){
        v = `(${v}`;
    }

    input.value = v;
}

/* ENVIO */
function enviar(e){
    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const estilo = document.getElementById("estilo").value;

    if(!nome || !email || !telefone || !estilo){
        alert("Preencha todos os campos corretamente.");
        return;
    }

    document.getElementById("loading").style.display = "flex";

    fetch(scriptURL,{
        method:"POST",
        body:new URLSearchParams({ nome, email, telefone, estilo })
    });

    setTimeout(()=>{
        window.location.href = "confirmacao-foto.html";
    }, 400);
}
</script>

</body>
</html>
