<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar Sessão</title>

<link rel="stylesheet" href="assets/style.css">

<style>
.container{
    padding:48px 22px 80px;
    text-align:center;
}

.form{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

input, select{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid #2a2a2a;
    background:#0b0b0b;
    color:#fff;
    font-size:15px;
}

button{
    margin-top:12px;
    padding:18px;
    border:none;
    border-radius:40px;
    font-size:18px;
    font-weight:600;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    cursor:pointer;
}

/* LOADING PREMIUM */
#loading{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    font-size:16px;
    letter-spacing:.4px;
    opacity:.92;
}
</style>
</head>

<body>

<div class="container">

<h1>Solicitar Sessão</h1>

<div class="subtitle">
Preencha os dados para agendar sua experiência fotográfica.
</div>

<div class="form">

<input type="text" id="nome" placeholder="Seu nome">

<input type="email" id="email" placeholder="Seu email">

<input type="tel" id="telefone" placeholder="Seu telefone">

<select id="estilo">
<option value="">Estilo de fotografia</option>
<option>Ensaio externo</option>
<option>Executivo</option>
<option>Casal</option>
<option>Black Experience</option>
</select>

<button onclick="enviar()">Enviar solicitação</button>

</div>

</div>

<!-- LOADING -->
<div id="loading">Carregando solicitação…</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbz3k2L4xBpscC2nWRIGmgcKT7cS6Wsv4rTZo8XHuKNpMCBaTFbmvrizn59lEJZwF1kWRw/exec";

function enviar(){

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const estilo = document.getElementById("estilo").value;

    if(!nome || !email || !telefone || !estilo){
        alert("Preencha todos os campos.");
        return;
    }

    /* mostra loading imediatamente */
    document.getElementById("loading").style.display = "flex";

    /* envia em segundo plano */
    fetch(scriptURL,{
        method:"POST",
        body:new URLSearchParams({ nome, email, telefone, estilo })
    });

    /* redireciona após pequena pausa de UX */
    setTimeout(()=>{
        window.location.href = "confirmacao-foto.html";
    }, 400);
}
</script>

</body>
</html>
