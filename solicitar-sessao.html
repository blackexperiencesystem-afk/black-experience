<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar sessão fotográfica</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

p{
    opacity:.6;
    margin-bottom:30px;
}

input, select, textarea{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:12px;
    border:none;
    background:#111;
    color:#fff;
    font-size:15px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:40px;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    cursor:pointer;
}

.success{
    margin-top:20px;
    color:#d4af37;
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Solicitar sessão fotográfica</h1>
<p>Preencha rapidamente. O motorista será avisado na hora.</p>

<form id="form">

<input type="text" name="entry.1983516271" placeholder="Seu nome" required>

<input type="tel" name="entry.768217560" placeholder="Telefone para envio das fotos" required>

<select name="entry.86139815" required>
<option value="">Escolha o estilo</option>
<option>Executivo</option>
<option>LinkedIn</option>
<option>Criativo</option>
<option>Casual</option>
</select>

<textarea name="entry.471992005" placeholder="Observações (opcional)"></textarea>

<button type="submit">Confirmar solicitação</button>

</form>

<div class="success" id="msg">
Pedido enviado ao motorista.  
Prepare-se para sua sessão ✨
</div>

</div>

<script>
const form = document.getElementById("form");

form.addEventListener("submit", function(e){
    e.preventDefault();

    fetch("https://docs.google.com/forms/d/e/1bHpuJk2aCOG52Jema45kbe1EL6ButR7yt_nr82RoV1E/formResponse", {
        method: "POST",
        mode: "no-cors",
        body: new FormData(form)
    });

    form.reset();
    document.getElementById("msg").style.display = "block";
});
</script>

</body>
</html>
