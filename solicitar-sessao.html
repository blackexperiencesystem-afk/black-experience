<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar Sessão</title>

<style>
    .back-container{
  width:100%;
  display:flex;
  justify-content:center;
  margin:40px 0 20px;
}

.back-btn{
  background:none;
  border:none;
  color:#777;
  font-size:14px;
  letter-spacing:1px;
  text-transform:lowercase;
  cursor:pointer;
  transition:0.2s;
}

.back-btn:hover{
  color:#fff;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#000;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:400px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input, select, button{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

input, select{
    background:#111;
    color:#fff;
}

button{
    background:#d4af37;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#msg{
    text-align:center;
    margin-top:10px;
    display:none;
}
</style>
</head>

<body>

<div class="container">
    <h1>Solicitar Sessão</h1>

    <form id="form">
        <input type="text" name="nome" placeholder="Seu nome" required>
        <input type="email" name="email" placeholder="Seu email" required>
        <input type="tel" name="telefone" placeholder="Seu telefone" required>

        <select name="estilo" required>
            <option value="">Estilo de fotografia</option>
            <option>Lifestyle Jovem (dono do carro)</option>
            <option>Executivo / Workaholic</option>
            <option>Casual Premium (casal ou amigos)</option>
            <option>Influencer / Social Media</option>
        </select>

        <button type="submit">Enviar solicitação</button>
        <button type="button" onclick="voltarPagina()">Voltar</button>

    </form>

    <div id="msg">Solicitação enviada com sucesso.</div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzmwI0MnZiODsnYT8S2cqMNKTcY_013Klvvg3mGbA-5XqfEshIyaFAUqpe4iZskkAcr/exec";
;

document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();

    fetch(scriptURL, {
        method: "POST",
        body: new FormData(e.target)
    })
    .then(() => {
        document.getElementById("msg").style.display = "block";
        e.target.reset();
    })
    .catch(() => {
        alert("Erro ao enviar. Tente novamente.");
    });
});
 

</script>
<div class="back-container">
  <button class="back-btn" onclick="goBack()">voltar</button>
</div>

<script>
function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "index.html"; // fallback seguro
  }
}
</script>

</body>
</html>
