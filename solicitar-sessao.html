<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar Sessão Fotográfica</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

p{
    opacity:.7;
    margin-bottom:25px;
}

input, select{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    border:none;
    background:#111;
    color:#fff;
    font-size:16px;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:40px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.primary{
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
}

.success{
    margin-top:20px;
    opacity:.9;
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Solicitar sessão fotográfica</h1>
<p>Preencha rapidamente. O motorista será avisado na hora.</p>

<form id="form">

<input type="text" id="nome" placeholder="Seu nome" required>
<input type="tel" id="telefone" placeholder="Telefone para envio das fotos" required>

<select id="estilo" required>
<option value="">Escolha o estilo</option>
<option>Executivo</option>
<option>Casual</option>
<option>Criativo</option>
<option>Romântico</option>
</select>

<select id="extras">
<option value="Nenhum">Extras desejados</option>
<option>Foto extra</option>
<option>Polaroid impressa</option>
<option>Vídeo curto</option>
</select>

<button type="submit" class="primary">Confirmar solicitação</button>

</form>

<div class="success" id="msg">
✅ Pedido enviado ao motorista.  
Ele iniciará sua sessão em instantes.
</div>

</div>

<script>
document.getElementById("form").addEventListener("submit", function(e){
    e.preventDefault();

    const data = new FormData();

    data.append("entry.768217560", document.getElementById("nome").value);
    data.append("entry.86139815", document.getElementById("telefone").value);
    data.append("entry.471992005", document.getElementById("estilo").value);
    data.append("entry.123456789", document.getElementById("extras").value); // ajuste se necessário

    fetch("https://docs.google.com/forms/d/e/1FAIpQLSf0Eykt8YrW3U3lxCUKUG-hB8rN0GPHh_uiEoav6AXcgOrB7w/formResponse", {
        method: "POST",
        mode: "no-cors",
        body: data
    }).then(() => {
        document.getElementById("msg").style.display = "block";
        document.getElementById("form").reset();
    });
});
</script>

</body>
</html>
