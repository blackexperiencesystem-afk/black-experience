<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar sessão</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
max-width:420px;
padding:32px 24px;
width:100%;
}

h1{
text-align:center;
margin-bottom:20px;
}

label{
display:block;
margin-top:16px;
margin-bottom:6px;
opacity:.8;
font-size:14px;
}

input, select{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#111;
color:#fff;
}

button{
margin-top:24px;
width:100%;
padding:16px;
border-radius:999px;
border:none;
background:linear-gradient(135deg,#e7c873,#c9a94e);
color:#000;
font-weight:600;
font-size:16px;
}

.small{
text-align:center;
margin-top:16px;
opacity:.4;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>Solicitar sessão</h1>

<form
action="https://docs.google.com/forms/d/e/1FAIpQLSfu2RVjCX-ocfrzTB5TruBUuWaG6FB32AW5AbBCjPdmSh3DZQ/formResponse"
method="POST"
target="hidden_iframe"
onsubmit="setTimeout(() => { window.location.href='confirmacao-foto.html'; }, 700);"
>

<label>Telefone para envio</label>
<input name="entry.768217560" required>

<label>Estilo de fotografia</label>
<select name="entry.86139815" required>
<option value="">Selecionar</option>
<option>Retrato profissional</option>
<option>Executivo corporativo</option>
<option>Casual elegante</option>
<option>Artístico preto e branco</option>
<option>Natural espontâneo</option>
</select>

<label>Observações</label>
<input name="entry.471992005">

<button type="submit">Confirmar solicitação</button>

</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<div class="small">Black Experience</div>

</div>

</body>
</html>
