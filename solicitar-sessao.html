<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar Sessão</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body{
  background:#000;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CONTAINER CENTRAL */
.page{
  width:100%;
  max-width:420px;
  padding:40px 20px;
}

/* TÍTULO */
h1{
  font-size:32px;
  font-weight:600;
  margin-bottom:30px;
}

/* CAMPOS */
input, select{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid #222;
  background:#0a0a0a;
  color:#fff;
  font-size:15px;
}

/* BOTÃO PRINCIPAL */
.btn-primary{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#d4af37;
  color:#000;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  margin-top:10px;
  transition:.2s;
}

.btn-primary:hover{
  opacity:.9;
}

/* VOLTAR DISCRETO */
.back{
  text-align:center;
  margin-top:60px;
  font-size:13px;
  color:#777;
  cursor:pointer;
  transition:.2s;
}

.back:hover{
  color:#fff;
}
</style>
</head>

<body>

<div class="page">

  <h1>Solicitar Sessão</h1>

  <form id="form">
    <input name="nome" placeholder="Seu nome" required>
    <input name="email" type="email" placeholder="Seu email" required>
    <input name="telefone" placeholder="Seu telefone" required>

    <select name="estilo" required>
      <option value="">Estilo de fotografia</option>
      <option>Retrato Premium</option>
      <option>Ensaio Executivo</option>
      <option>Casal / Amigos</option>
      <option>Black Experience</option>
    </select>

    <button type="submit" class="btn-primary">
      Enviar solicitação
    </button>
  </form>

  <div class="back" onclick="goBack()">← voltar</div>

</div>

<script>
const scriptURL = "COLE_AQUI_SUA_URL_DO_WEBAPP";

document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  fetch(scriptURL, {
    method:"POST",
    body:new FormData(this)
  })
  .then(()=>{
    alert("Solicitação enviada com sucesso.");
    this.reset();
  })
  .catch(()=>{
    alert("Erro ao enviar. Tente novamente.");
  });
});

function goBack(){
  if (window.history.length > 1){
    window.history.back();
  } else {
    window.location.href = "index.html";
  }
}
</script>

</body>
</html>
