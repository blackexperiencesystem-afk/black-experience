<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitar Sessão</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

p{
    opacity:.7;
    margin-bottom:30px;
}

input, select{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:12px;
    border:none;
    font-size:15px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:30px;
    font-size:16px;
    font-weight:600;
    background:linear-gradient(135deg,#e5c15a,#cfa73a);
    color:#000;
}

.sucesso{
    display:none;
}

.sucesso h2{
    font-size:26px;
    margin-bottom:12px;
}

.sucesso p{
    opacity:.8;
}
</style>
</head>

<body>

<div class="container">

<!-- FORMULÁRIO -->
<div id="formulario">
<h1>Solicitar sessão fotográfica</h1>
<p>Preencha rapidamente para iniciarmos sua sessão dentro do carro.</p>

<form
action="https://docs.google.com/forms/d/e/1FAIpQLSfu2RVjCX-ocfrzTB5TruBUuWaG6FB32AW5AbBCjPdmSh3DZQ/formResponse"
method="POST"
target="hidden_iframe"
onsubmit="enviado()"
>

<input name="entry.768217560" placeholder="Seu nome" required>

<input name="entry.86139815" placeholder="Telefone para envio das fotos" required>

<select name="entry.471992005" required>
<option value="">Estilo de fotografia</option>
<option>Executivo clássico</option>
<option>Cinematográfico</option>
<option>Descontraído</option>
<option>Romântico</option>
</select>

<button type="submit">Confirmar solicitação</button>
</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>
</div>


<!-- MENSAGEM DE SUCESSO -->
<div id="sucesso" class="sucesso">
<h2>Solicitação enviada ✨</h2>
<p>
O motorista foi notificado e irá iniciar sua sessão fotográfica em instantes.
</p>
</div>

</div>


<script>
function enviado(){
    setTimeout(function(){
        document.getElementById("formulario").style.display="none";
        document.getElementById("sucesso").style.display="block";
    }, 800);
}
</script>

</body>
</html>
