<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar Sessão • Black Experience</title>

<link rel="stylesheet" href="assets/style.css">

<style>
/* Ajustes específicos da página */
.page{
  width:100%;
  max-width:420px;
  padding:40px 20px;
}

h1{
  text-align:center;
}

input, select{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid #222;
  background:#0a0a0a;
  color:#fff;
  font-size:15px;
}

.btn-primary{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#d4af37;
  color:#000;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="page">

  <h1>Solicitar Sessão</h1>

  <form id="form">
    <input name="nome" placeholder="Seu nome" required>
    <input name="email" type="email" placeholder="Seu email" required>

    <input
      name="telefone"
      id="telefone"
      placeholder="(00) 00000-0000"
      maxlength="15"
      required
    >

    <select name="estilo" required>
      <option value="">Estilo de fotografia</option>
      <option>Retrato Premium</option>
      <option>Ensaio Executivo</option>
      <option>Casal / Amigos</option>
      <option>Black Experience</option>
    </select>

    <button type="submit" class="btn-primary">
      Enviar solicitação
    </button>
  </form>

  <div class="back" onclick="goBack()">← voltar</div>

</div>

<script src="assets/ui.js"></script>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxr5hzq91fHkqdlDUCg6MLQ89TE-11dzQoziNST7AWp4q6h302mB1mg4vOmOvQjo7svng/exec";

/* ===== MÁSCARA TELEFONE ===== */
const telefoneInput = document.getElementById("telefone");

telefoneInput.addEventListener("input", function(e){
  let valor = e.target.value.replace(/\D/g, "");

  if (valor.length > 11) valor = valor.slice(0,11);

  if (valor.length > 6){
    valor = `(${valor.slice(0,2)}) ${valor.slice(2,7)}-${valor.slice(7)}`;
  } else if (valor.length > 2){
    valor = `(${valor.slice(0,2)}) ${valor.slice(2)}`;
  } else if (valor.length > 0){
    valor = `(${valor}`;
  }

  e.target.value = valor;
});

/* ===== ENVIO DO FORMULÁRIO ===== */
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  const telefoneValido = /^\(\d{2}\) \d{5}-\d{4}$/.test(telefoneInput.value);

  if (!telefoneValido){
    alert("Digite um telefone válido no formato (00) 00000-0000");
    return;
  }

  fetch(scriptURL, {
    method:"POST",
    body:new FormData(this)
  })
  .then(()=>{
    /* REDIRECIONAMENTO PREMIUM */
    window.location.href = "confirmacao-foto.html";
  })
  .catch(()=>{
    alert("Erro ao enviar. Tente novamente.");
  });
});
</script>

</body>
</html>
