<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar sessão</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
max-width:420px;
padding:40px 24px;
width:100%;
}

h1{
font-size:28px;
margin-bottom:20px;
text-align:center;
}

label{
display:block;
margin-top:18px;
margin-bottom:6px;
font-size:14px;
opacity:.8;
}

input, select{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#111;
color:#fff;
}

.btn{
margin-top:28px;
width:100%;
padding:16px;
border-radius:999px;
border:none;
background:linear-gradient(135deg,#d4af37,#f1d27a);
color:#000;
font-weight:600;
font-size:16px;
}

.small{
text-align:center;
margin-top:20px;
opacity:.4;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>Solicitar sessão</h1>

<form
action="https://docs.google.com/forms/d/e/1bHpuJk2aCOG52Jema45kbe1EL6ButR7yt_nr82RoV1E/formResponse"
method="POST"
target="hidden_iframe"
onsubmit="setTimeout(() => { window.location.href='confirmacao-foto.html'; }, 700);"
>

<label>Telefone para envio das fotos</label>
<input name="entry.768217560" required>

<label>Estilo de fotografia</label>
<select name="entry.86139815" required>
<option value="">Selecionar</option>
<option>Retrato profissional</option>
<option>Executivo corporativo</option>
<option>Casual elegante</option>
<option>Artístico em preto e branco</option>
<option>Natural espontâneo</option>
</select>

<label>Observações rápidas</label>
<input name="entry.471992005">

<button class="btn" type="submit">
Confirmar solicitação
</button>

</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<div class="small">
Black Experience
</div>

</div>

</body>
</html>
