<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Experience</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #000;
    color: #fff;

    /* CENTRALIZAÇÃO REAL */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CONTAINER PRINCIPAL */
.container {
    width: 100%;
    max-width: 900px;
    padding: 40px 30px;
    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* TÍTULO */
h1 {
    font-size: 52px;
    margin: 0 0 12px 0;
}

/* FRASE EMOCIONAL */
.subtitle {
    font-size: 20px;
    color: #bdbdbd;
    margin-bottom: 50px;
}

/* GRID DOS CARDS */
.grid {
    width: 100%;
    max-width: 600px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;

    margin-bottom: 50px;
}

/* CARDS ESCUROS */
.card {
    background: #111;
    border: 1px solid #222;
    border-radius: 20px;
    padding: 22px;
    font-size: 20px;
}

/* BOTÃO PRINCIPAL */
.button-main {
    width: 100%;
    max-width: 600px;

    padding: 22px;
    margin-bottom: 18px;

    font-size: 22px;
    font-weight: bold;
    text-decoration: none;
    color: #000;

    border-radius: 40px;
    background: linear-gradient(135deg, #d4af37, #f1d27a);
}

/* TEXTO PEQUENO DO BOTÃO */
.button-main small {
    display: block;
    font-size: 14px;
    font-weight: normal;
    margin-top: 4px;
}

/* BOTÃO SECUNDÁRIO */
.button-secondary {
    width: 90%;
    max-width: 540px;

    padding: 18px;
    margin-bottom: 28px;

    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    color: #000;

    border-radius: 40px;
    background: linear-gradient(135deg, #c9a94a, #e5c97a);
}

/* PROVA SOCIAL */
.footer {
    font-size: 14px;
    color: #777;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Black Experience</h1>

    <div class="subtitle">
        Transforme esta viagem em uma experiência exclusiva.
    </div>

    <div class="grid">
        <div class="card">🎬 Cinema</div>
        <div class="card">🎮 Jogos</div>
        <div class="card">🎵 Música</div>
        <div class="card">❄️ Conforto</div>
    </div>

    <a href="premium.html" class="button-main">
        ⭐ Ativar Passe Premium
        <small>Entretenimento completo, bebidas e conforto exclusivo nesta viagem</small>
    </a>

    <a href="fotografia.html" class="button-secondary">
        📸 Fotografia Executiva no Carro
    </a>

    <div class="footer">
        Centenas de passageiros já viveram a Black Experience.
    </div>

</div>

</body>
</html>
