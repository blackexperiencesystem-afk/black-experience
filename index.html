<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Experience</title>

<style>
html, body {
    height: 100%;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* CONTAINER CENTRAL REAL */
.container {
    max-width: 960px;
    width: 100%;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* TÍTULO */
h1 {
    font-size: 48px;
    margin: 0 0 12px;
}

/* SUBTÍTULO */
.subtitle {
    font-size: 20px;
    color: #bbb;
    margin-bottom: 48px;
    max-width: 700px;
}

/* GRID */
.grid {
    width: 100%;
    max-width: 800px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    margin-bottom: 48px;
}

/* CARDS */
.card {
    background: #111;
    border-radius: 22px;
    padding: 32px 20px;
    font-size: 20px;
    border: 1px solid #222;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* BOTÃO PRINCIPAL */
.button-main {
    display: block;
    width: 100%;
    max-width: 700px;
    padding: 24px;
    margin-bottom: 24px;
    font-size: 22px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, #d4af37, #f1d27a);
    color: #000;
    font-weight: bold;
    text-decoration: none;
}

.button-main small {
    display: block;
    font-size: 14px;
    font-weight: normal;
    margin-top: 6px;
}

/* BOTÃO SECUNDÁRIO */
.button-secondary {
    display: block;
    width: 100%;
    max-width: 640px;
    padding: 20px;
    font-size: 20px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, #c9a94a, #e5c97a);
    color: #000;
    font-weight: bold;
    text-decoration: none;
    margin-bottom: 32px;
}

/* RODAPÉ */
.footer {
    font-size: 14px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

    <h1>Black Experience</h1>

    <div class="subtitle">
        Transforme esta viagem em uma experiência exclusiva.
    </div>

    <div class="grid">
        <a href="cinema.html" class="card">🎬 Cinema</a>
        <a href="jogos.html" class="card">🎮 Jogos</a>
        <a href="musica.html" class="card">🎵 Música</a>
        <a href="conforto.html" class="card">❄️ Conforto</a>
        <a href="executivo.html" class="card">💼 Executivo</a>
    </div>

    <!-- BOTÃO PRINCIPAL -->
    <a href="premium.html" class="button-main">
        ⭐ Ativar Passe Premium
        <small>Entretenimento completo, bebidas e conforto exclusivo nesta viagem</small>
    </a>

    <!-- BOTÃO FOTOGRAFIA -->
    <a href="fotografia.html" class="button-secondary">
        📸 Fotografia Executiva no Carro
    </a>

    <div class="footer">
        Centenas de passageiros já viveram a Black Experience.
    </div>

</div>

</body>
</html>
