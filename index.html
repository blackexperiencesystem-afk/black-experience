<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Experience</title>

<style>
body{
  margin:0;
  background:#0a0a0a;
  color:#ffffff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
}

h1{
  font-size:40px;
  letter-spacing:2px;
  margin-bottom:8px;
}

p{
  opacity:.6;
  margin-bottom:40px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  width:82%;
  max-width:520px;
}

.btn{
  background:#111;
  border:1px solid #2a2a2a;
  border-radius:20px;
  padding:26px 10px;
  font-size:20px;
  text-align:center;
  transition:.15s;
}

.btn:active{
  transform:scale(.96);
  background:#1b1b1b;
}

.vip{
  margin-top:26px;
  width:82%;
  max-width:520px;
  padding:22px;
  border-radius:20px;
  text-align:center;
  font-size:22px;
  font-weight:600;
  color:#000;
  background:linear-gradient(135deg,#caa24d,#f1d488);
}
</style>
</head>

<body>

<h1>Black Experience</h1>
<p>Entretenimento e conforto premium</p>

<div class="grid">
  <div class="btn">🎬 Cinema</div>
  <div class="btn">🎮 Jogos</div>
  <div class="btn">🎵 Música</div>
  <div class="btn">💺 Conforto</div>
</div>

<div class="vip">⭐ Ativar Passe Premium</div>

</body>
</html>
