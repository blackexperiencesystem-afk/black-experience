<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos • Black Experience</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.container{
    width:100%;
    max-width:420px;
    padding:32px 24px;
    text-align:center;
}

.logo{
    font-size:26px;
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:6px;
}

.subtitle{
    font-size:14px;
    opacity:.6;
    margin-bottom:40px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.btn{
    width:100%;
    padding:20px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.15);
    background:#0e0e0e;
    color:#fff;
    font-size:16px;
    font-weight:500;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
}

.btn span{
    font-size:22px;
}

.btn:hover{
    background:#151515;
}

.voltar{
    margin-top:28px;
    font-size:13px;
    opacity:.4;
    color:#fff;
    text-decoration:none;
    display:inline-block;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🎮 Jogos</div>
    <div class="subtitle">Escolha o console</div>

    <div class="menu">
        <div class="btn" onclick="abrirPS2()">
            <span>🕹️</span> PlayStation 2
        </div>

        <div class="btn" onclick="abrirN64()">
            <span>🎮</span> Nintendo 64
        </div>
    </div>

    <a href="index.html" class="voltar">Voltar</a>

</div>

<script>
function abrirPS2(){
    if (typeof fully !== "undefined") {
        fully.startApplication("xyz.aethersx2.android");
    }
}

function abrirN64(){
    if (typeof fully !== "undefined") {
        fully.startApplication("com.swordfish.lemuroid");
    }
}
</script>

</body>
</html>
