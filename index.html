<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Experience</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.container {
    max-width: 900px;
    width: 90%;
}

h1 {
    font-size: 48px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 20px;
    color: #bbb;
    margin-bottom: 40px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 40px;
}

.card {
    background: #111;
    border-radius: 20px;
    padding: 25px;
    font-size: 20px;
    border: 1px solid #222;
}

.button-main {
    display: block;
    width: 100%;
    padding: 22px;
    margin-bottom: 20px;
    font-size: 22px;
    border-radius: 40px;
    border: none;
    background: linear-gradient(135deg, #d4af37, #f1d27a);
    color: #000;
    font-weight: bold;
    text-decoration: none;
}

.button-main small {
    display: block;
    font-size: 14px;
    font-weight: normal;
}

.button-secondary {
    display: block;
    width: 90%;
    margin: 0 auto 30px;
    padding: 18px;
    font-size: 20px;
    border-radius: 40px;
    border: none;
    background: linear-gradient(135deg, #c9a94a, #e5c97a);
    color: #000;
    font-weight: bold;
    text-decoration: none;
}

.footer {
    font-size: 14px;
    color: #777;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Black Experience</h1>
    <div class="subtitle">
        Transforme esta viagem em uma experiência exclusiva.
    </div>

    <div class="grid">
        <div class="card">🎬 Cinema</div>
        <div class="card">🎮 Jogos</div>
        <div class="card">🎵 Música</div>
        <div class="card">❄️ Conforto</div>
    </div>

    <!-- BOTÃO PRINCIPAL -->
    <a href="premium.html" class="button-main">
        ⭐ Ativar Passe Premium
        <small>Entretenimento completo, bebidas e conforto exclusivo nesta viagem</small>
    </a>

    <!-- BOTÃO FOTOGRAFIA -->
    <a href="fotografia.html" class="button-secondary">
        📸 Fotografia Executiva no Carro
    </a>

    <div class="footer">
        Centenas de passageiros já viveram a Black Experience.
    </div>

</div>

</body>
</html>
