<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Experience</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.container{
    width:100%;
    max-width:420px;
    padding:32px 24px;
    text-align:center;
}

.logo{
    font-size:26px;
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:6px;
}

.subtitle{
    font-size:14px;
    opacity:.6;
    margin-bottom:40px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.btn{
    width:100%;
    padding:18px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.15);
    background:#0e0e0e;
    color:#fff;
    font-size:16px;
    font-weight:500;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.btn span{
    font-size:20px;
}

.btn:hover{
    background:#151515;
}

.btn-premium{
    margin-top:18px;
    background:linear-gradient(135deg,#d4af37,#f1d27a);
    color:#000;
    border:none;
    font-weight:600;
}

.footer{
    margin-top:28px;
    font-size:11px;
    opacity:.4;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">Black Experience</div>
    <div class="subtitle">Sua viagem em outro nível</div>

    <div class="menu">
        <a href="cinema.html" class="btn">
            <span>🎬</span> Cinema
        </a>

        <a href="jogos.html" class="btn">
            <span>🎮</span> Jogos
        </a>

        <a href="musica.html" class="btn">
            <span>🎵</span> Música
        </a>

        <a href="conforto.html" class="btn">
            <span>❄️</span> Conforto
        </a>

        <a href="fotografia.html" class="btn">
            <span>📸</span> Fotografia Executiva
        </a>

        <a href="vip.html" class="btn btn-premium">
            Ativar Passe Premium
        </a>
    </div>

    <div class="footer">
        Experiência exclusiva para passageiros
    </div>

</div>

</body>
</html>
